<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D City Scene</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-family: Arial, sans-serif;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
        }
        #time-control {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-family: Arial, sans-serif;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
            display: flex;
            align-items: center;
        }
        #time-slider {
            width: 200px;
            margin: 0 10px;
        }
    </style>
</head>
<body>
    <div id="info">
        <h3>3D City Scene</h3>
        <p>Controls: WASD to move, mouse to look around</p>
        <p>Click and drag to rotate the camera</p>
        <p>Scroll to zoom in/out</p>
    </div>
    
    <div id="time-control">
        <span>Time of Day:</span>
        <input type="range" id="time-slider" min="0" max="24" value="12" step="0.1">
        <span id="time-display">12:00</span>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.7/dat.gui.min.js"></script>
    <script>
        // Initialize the scene
        const scene = new THREE.Scene();
        
        // Create camera
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 15, 50);
        
        // Create renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);
        
        // Handle window resize
        window.addEventListener('resize', () => {
            const width = window.innerWidth;
            const height = window.innerHeight;
            renderer.setSize(width, height);
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
        });
        
        // -------- CITY LAYOUT --------
        const citySize = 200;
        const blockSize = 20;
        const roadWidth = 10;
        
        // Ground
        const groundGeometry = new THREE.PlaneGeometry(citySize * 2, citySize * 2);
        const groundMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x222222, 
            roughness: 0.8 
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);
        
        // -------- BUILDINGS --------
        const buildingTypes = {
            SKYSCRAPER: 'skyscraper',
            APARTMENT: 'apartment',
            SHOP: 'shop'
        };
        
        function createBuilding(type, x, z, width, depth) {
            const buildingGroup = new THREE.Group();
            let height;
            let color;
            let windows = true;
            
            switch(type) {
                case buildingTypes.SKYSCRAPER:
                    height = 40 + Math.random() * 60;
                    color = 0x444444 + Math.random() * 0x222222;
                    break;
                case buildingTypes.APARTMENT:
                    height = 15 + Math.random() * 15;
                    color = 0x885544 + Math.random() * 0x332211;
                    break;
                case buildingTypes.SHOP:
                    height = 5 + Math.random() * 5;
                    color = 0x778899 + Math.random() * 0x223344;
                    break;
            }
            
            // Building main structure
            const buildingGeometry = new THREE.BoxGeometry(width, height, depth);
            const buildingMaterial = new THREE.MeshStandardMaterial({ 
                color: color,
                roughness: 0.7,
                metalness: 0.2
            });
            const building = new THREE.Mesh(buildingGeometry, buildingMaterial);
            building.position.y = height / 2;
            building.position.x = x;
            building.position.z = z;
            building.castShadow = true;
            building.receiveShadow = true;
            buildingGroup.add(building);
            
            // Add windows
            if (windows) {
                const windowSpacing = 2;
                const windowSize = 1;
                const windowDepth = 0.1;
                
                for (let i = 1; i < height - 2; i += windowSpacing) {
                    for (let j = -width/2 + 2; j < width/2 - 1; j += windowSpacing) {
                        // Front windows
                        addWindow(j, i, depth/2 + windowDepth/2, buildingGroup, windowSize);
                        
                        // Back windows
                        addWindow(j, i, -depth/2 - windowDepth/2, buildingGroup, windowSize);
                        
                        // Side windows (fewer)
                        if (Math.random() > 0.7) {
                            // Right side
                            addWindow(width/2 + windowDepth/2, i, j, buildingGroup, windowSize);
                            
                            // Left side
                            addWindow(-width/2 - windowDepth/2, i, j, buildingGroup, windowSize);
                        }
                    }
                }
            }
            
            // Rooftop details for skyscrapers and apartments
            if (type !== buildingTypes.SHOP) {
                const roofStructureGeometry = new THREE.BoxGeometry(width * 0.5, 2, depth * 0.5);
                const roofStructureMaterial = new THREE.MeshStandardMaterial({ color: 0x333333 });
                const roofStructure = new THREE.Mesh(roofStructureGeometry, roofStructureMaterial);
                roofStructure.position.y = height + 1;
                roofStructure.castShadow = true;
                buildingGroup.add(roofStructure);
                
                if (type === buildingTypes.SKYSCRAPER && Math.random() > 0.5) {
                    // Antenna for skyscrapers
                    const antennaGeometry = new THREE.CylinderGeometry(0.2, 0.2, 10, 8);
                    const antennaMaterial = new THREE.MeshStandardMaterial({ color: 0x111111 });
                    const antenna = new THREE.Mesh(antennaGeometry, antennaMaterial);
                    antenna.position.y = height + 6;
                    buildingGroup.add(antenna);
                }
            }
            
            return buildingGroup;
        }
        
        function addWindow(x, y, z, buildingGroup, size) {
            const windowGeometry = new THREE.PlaneGeometry(size, size);
            const windowMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xffffaa,
                transparent: true,
                opacity: 0.8,
                emissive: 0xffffaa,
                emissiveIntensity: 0.5
            });
            const windowMesh = new THREE.Mesh(windowGeometry, windowMaterial);
            windowMesh.position.set(x, y, z);
            
            // Rotate the window depending on its position
            if (Math.abs(z) > Math.abs(x)) {
                windowMesh.rotation.y = (z > 0) ? 0 : Math.PI;
            } else {
                windowMesh.rotation.y = (x > 0) ? Math.PI / 2 : -Math.PI / 2;
            }
            
            buildingGroup.add(windowMesh);
        }
        
        // -------- GENERATE CITY BLOCKS --------
        function generateCity() {
            const cityBlocks = new THREE.Group();
            
            for (let x = -citySize/2; x < citySize/2; x += blockSize + roadWidth) {
                for (let z = -citySize/2; z < citySize/2; z += blockSize + roadWidth) {
                    // Determine block type based on distance from center
                    const distFromCenter = Math.sqrt(x*x + z*z);
                    let blockType;
                    
                    if (distFromCenter < citySize/5) {
                        // Downtown - skyscrapers
                        blockType = buildingTypes.SKYSCRAPER;
                    } else if (distFromCenter < citySize/2) {
                        // Mid city - mix of apartments and some shops
                        blockType = Math.random() > 0.2 ? buildingTypes.APARTMENT : buildingTypes.SHOP;
                    } else {
                        // Outer city - mostly shops and some apartments
                        blockType = Math.random() > 0.7 ? buildingTypes.APARTMENT : buildingTypes.SHOP;
                    }
                    
                    // Create a block of buildings
                    const blockWidth = blockSize;
                    const blockDepth = blockSize;
                    
                    if (blockType === buildingTypes.SKYSCRAPER) {
                        // Few large buildings
                        const buildingWidth = blockWidth * (0.3 + Math.random() * 0.3);
                        const buildingDepth = blockDepth * (0.3 + Math.random() * 0.3);
                        
                        for (let i = 0; i < 1 + Math.random() * 2; i++) {
                            const offsetX = (Math.random() - 0.5) * (blockWidth - buildingWidth);
                            const offsetZ = (Math.random() - 0.5) * (blockDepth - buildingDepth);
                            const building = createBuilding(blockType, x + offsetX, z + offsetZ, buildingWidth, buildingDepth);
                            cityBlocks.add(building);
                        }
                    } else if (blockType === buildingTypes.APARTMENT) {
                        // Medium buildings along the perimeter
                        const buildingWidth = 6 + Math.random() * 4;
                        const buildingDepth = 6 + Math.random() * 4;
                        const gap = 1;
                        
                        // Place buildings around the perimeter
                        for (let bx = -blockWidth/2 + buildingWidth/2; bx < blockWidth/2; bx += buildingWidth + gap) {
                            // North and South sides
                            cityBlocks.add(createBuilding(blockType, x + bx, z - blockDepth/2 + buildingDepth/2, buildingWidth, buildingDepth));
                            cityBlocks.add(createBuilding(blockType, x + bx, z + blockDepth/2 - buildingDepth/2, buildingWidth, buildingDepth));
                        }
                        
                        for (let bz = -blockDepth/2 + buildingDepth/2; bz < blockDepth/2; bz += buildingDepth + gap) {
                            // East and West sides
                            cityBlocks.add(createBuilding(blockType, x - blockWidth/2 + buildingWidth/2, z + bz, buildingWidth, buildingDepth));
                            cityBlocks.add(createBuilding(blockType, x + blockWidth/2 - buildingWidth/2, z + bz, buildingWidth, buildingDepth));
                        }
                    } else {
                        // Small shops in a more varied pattern
                        const buildingWidth = 3 + Math.random() * 2;
                        const buildingDepth = 3 + Math.random() * 2;
                        
                        for (let i = 0; i < 3 + Math.random() * 5; i++) {
                            const offsetX = (Math.random() - 0.5) * (blockWidth - buildingWidth);
                            const offsetZ = (Math.random() - 0.5) * (blockDepth - buildingDepth);
                            const building = createBuilding(blockType, x + offsetX, z + offsetZ, buildingWidth, buildingDepth);
                            cityBlocks.add(building);
                        }
                    }
                    
                    // Add street elements like trees, benches, lampposts
                    addStreetElements(x, z, blockSize, cityBlocks);
                }
            }
            
            scene.add(cityBlocks);
        }
        
        // -------- STREET ELEMENTS --------
        function addStreetElements(blockX, blockZ, blockSize, cityBlocks) {
            // Add trees along sidewalks
            const treePositions = [
                { x: blockX - blockSize/2 - 3, z: blockZ - blockSize/2 - 3 }, // Corner
                { x: blockX + blockSize/2 + 3, z: blockZ - blockSize/2 - 3 }, // Corner
                { x: blockX - blockSize/2 - 3, z: blockZ + blockSize/2 + 3 }, // Corner
                { x: blockX + blockSize/2 + 3, z: blockZ + blockSize/2 + 3 }  // Corner
            ];
            
            // Add some random trees along the streets
            for (let i = -blockSize/2; i <= blockSize/2; i += 10) {
                if (Math.random() > 0.5) {
                    treePositions.push({ x: blockX + i, z: blockZ - blockSize/2 - 3 });
                    treePositions.push({ x: blockX + i, z: blockZ + blockSize/2 + 3 });
                }
                if (Math.random() > 0.5) {
                    treePositions.push({ x: blockX - blockSize/2 - 3, z: blockZ + i });
                    treePositions.push({ x: blockX + blockSize/2 + 3, z: blockZ + i });
                }
            }
            
            // Create trees
            treePositions.forEach(pos => {
                // Only place if not on road intersection
                if (!isIntersection(pos.x, pos.z)) {
                    const tree = createTree();
                    tree.position.set(pos.x, 0, pos.z);
                    cityBlocks.add(tree);
                }
            });
            
            // Add lampposts at some corners and along streets
            const lampPositions = [
                { x: blockX - blockSize/2 - 4, z: blockZ - blockSize/2 - 4 }, // Corner
                { x: blockX + blockSize/2 + 4, z: blockZ - blockSize/2 - 4 }, // Corner
                { x: blockX - blockSize/2 - 4, z: blockZ + blockSize/2 + 4 }, // Corner
                { x: blockX + blockSize/2 + 4, z: blockZ + blockSize/2 + 4 }  // Corner
            ];
            
            // Create lampposts
            lampPositions.forEach(pos => {
                if (!isIntersection(pos.x, pos.z) && Math.random() > 0.3) {
                    const lamppost = createLamppost();
                    lamppost.position.set(pos.x, 0, pos.z);
                    cityBlocks.add(lamppost);
                }
            });
            
            // Add benches along sidewalks
            if (Math.random() > 0.7) {
                const benchPos = {
                    x: blockX + (Math.random() - 0.5) * blockSize,
                    z: blockZ - blockSize/2 - 3
                };
                
                if (!isIntersection(benchPos.x, benchPos.z)) {
                    const bench = createBench();
                    bench.position.set(benchPos.x, 0, benchPos.z);
                    bench.rotation.y = Math.PI / 2;
                    cityBlocks.add(bench);
                }
            }
        }
        
        function isIntersection(x, z) {
            // Check if the position is at a road intersection
            const blockSize = 20;
            const roadWidth = 10;
            const tolerance = 8;
            
            const modX = Math.abs(x) % (blockSize + roadWidth);
            const modZ = Math.abs(z) % (blockSize + roadWidth);
            
            return (modX > blockSize - tolerance || modX < tolerance) && 
                   (modZ > blockSize - tolerance || modZ < tolerance);
        }
        
        function createTree() {
            const treeGroup = new THREE.Group();
            
            // Tree trunk
            const trunkGeometry = new THREE.CylinderGeometry(0.2, 0.4, 2, 8);
            const trunkMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x8B4513,
                roughness: 0.9
            });
            const trunk = new THREE.Mesh(trunkGeometry, trunkMaterial);
            trunk.position.y = 1;
            trunk.castShadow = true;
            treeGroup.add(trunk);
            
            // Tree foliage
            const foliageGeometry = new THREE.ConeGeometry(1.5, 3, 8);
            const foliageMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x2E8B57,
                roughness: 0.8
            });
            
            const foliage1 = new THREE.Mesh(foliageGeometry, foliageMaterial);
            foliage1.position.y = 3;
            foliage1.castShadow = true;
            treeGroup.add(foliage1);
            
            const foliage2 = new THREE.Mesh(foliageGeometry, foliageMaterial);
            foliage2.position.y = 4;
            foliage2.scale.set(0.8, 0.8, 0.8);
            foliage2.castShadow = true;
            treeGroup.add(foliage2);
            
            return treeGroup;
        }
        
        function createLamppost() {
            const lampGroup = new THREE.Group();
            
            // Lamp post
            const postGeometry = new THREE.CylinderGeometry(0.2, 0.2, 6, 8);
            const postMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x333333,
                roughness: 0.7
            });
            const post = new THREE.Mesh(postGeometry, postMaterial);
            post.position.y = 3;
            post.castShadow = true;
            lampGroup.add(post);
            
            // Lamp head
            const headGeometry = new THREE.CylinderGeometry(0.5, 0.5, 0.4, 8);
            const headMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x555555,
                roughness: 0.5
            });
            const head = new THREE.Mesh(headGeometry, headMaterial);
            head.position.y = 6;
            head.rotation.x = Math.PI / 2;
            lampGroup.add(head);
            
            // Lamp light
            const lightGeometry = new THREE.SphereGeometry(0.3, 16, 16);
            const lightMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xFFFFCC,
                emissive: 0xFFFFCC,
                emissiveIntensity: 1,
                transparent: true,
                opacity: 0.9
            });
            const light = new THREE.Mesh(lightGeometry, lightMaterial);
            light.position.y = 6;
            light.userData.isLampLight = true;
            lampGroup.add(light);
            
            // Add actual light source
            const pointLight = new THREE.PointLight(0xFFFFCC, 0.7, 10);
            pointLight.position.y = 6;
            pointLight.castShadow = true;
            pointLight.shadow.mapSize.width = 512;
            pointLight.shadow.mapSize.height = 512;
            pointLight.userData.isLampLightSource = true;
            lampGroup.add(pointLight);
            
            return lampGroup;
        }
        
        function createBench() {
            const benchGroup = new THREE.Group();
            
            // Bench seat
            const seatGeometry = new THREE.BoxGeometry(3, 0.2, 0.8);
            const seatMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x8B4513,
                roughness: 0.9
            });
            const seat = new THREE.Mesh(seatGeometry, seatMaterial);
            seat.position.y = 0.6;
            seat.castShadow = true;
            benchGroup.add(seat);
            
            // Bench legs
            const legGeometry = new THREE.BoxGeometry(0.2, 0.6, 0.8);
            const legMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x333333,
                roughness: 0.7
            });
            
            const leg1 = new THREE.Mesh(legGeometry, legMaterial);
            leg1.position.set(-1.2, 0.3, 0);
            leg1.castShadow = true;
            benchGroup.add(leg1);
            
            const leg2 = new THREE.Mesh(legGeometry, legMaterial);
            leg2.position.set(1.2, 0.3, 0);
            leg2.castShadow = true;
            benchGroup.add(leg2);
            
            // Bench backrest
            const backrestGeometry = new THREE.BoxGeometry(3, 0.8, 0.2);
            const backrest = new THREE.Mesh(backrestGeometry, seatMaterial);
            backrest.position.set(0, 1.2, -0.3);
            backrest.castShadow = true;
            benchGroup.add(backrest);
            
            return benchGroup;
        }
        
        // -------- ROADS & TRAFFIC --------
        function createRoads() {
            const roadGroup = new THREE.Group();
            
            // Create crosswalks at intersections
            for (let x = -citySize/2; x < citySize/2; x += blockSize + roadWidth) {
                for (let z = -citySize/2; z < citySize/2; z += blockSize + roadWidth) {
                    // Create traffic lights
                    createTrafficLights(x, z, roadGroup);
                    
                    // Create crosswalks
                    createCrosswalk(x, z, roadWidth, 'x', roadGroup);
                    createCrosswalk(x, z, roadWidth, 'z', roadGroup);
                }
            }
            
            // Add road markings (lane dividers)
            for (let x = -citySize/2; x < citySize/2; x += blockSize + roadWidth) {
                for (let z = -citySize/2 + (blockSize + roadWidth)/2; z < citySize/2; z += blockSize + roadWidth) {
                    createRoadMarking(x, z, 'x', roadGroup);
                }
            }
            
            for (let z = -citySize/2; z < citySize/2; z += blockSize + roadWidth) {
                for (let x = -citySize/2 + (blockSize + roadWidth)/2; x < citySize/2; x += blockSize + roadWidth) {
                    createRoadMarking(x, z, 'z', roadGroup);
                }
            }
            
            scene.add(roadGroup);
        }
        
        function createCrosswalk(x, z, width, direction, roadGroup) {
            const stripeWidth = 0.5;
            const stripeLength = 3;
            const stripeSpacing = 0.5;
            const numStripes = 5;
            
            const stripeGeometry = new THREE.BoxGeometry(
                direction === 'x' ? stripeWidth : stripeLength,
                0.05,
                direction === 'x' ? stripeLength : stripeWidth
            );
            const stripeMaterial = new THREE.MeshStandardMaterial({ color: 0xFFFFFF });
            
            const crosswalkGroup = new THREE.Group();
            
            for (let i = 0; i < numStripes; i++) {
                const offset = (i - numStripes / 2) * (stripeWidth + stripeSpacing);
                
                const stripe = new THREE.Mesh(stripeGeometry, stripeMaterial);
                stripe.position.y = 0.025;
                
                if (direction === 'x') {
                    stripe.position.x = x + offset;
                    stripe.position.z = z - width / 2;
                } else {
                    stripe.position.x = x - width / 2;
                    stripe.position.z = z + offset;
                }
                
                crosswalkGroup.add(stripe);
                
                // Create second set of stripes on the other side of the intersection
                const stripe2 = new THREE.Mesh(stripeGeometry, stripeMaterial);
                stripe2.position.y = 0.025;
                
                if (direction === 'x') {
                    stripe2.position.x = x + offset;
                    stripe2.position.z = z + width / 2;
                } else {
                    stripe2.position.x = x + width / 2;
                    stripe2.position.z = z + offset;
                }
                
                crosswalkGroup.add(stripe2);
            }
            
            roadGroup.add(crosswalkGroup);
        }
        
        function createRoadMarking(x, z, direction, roadGroup) {
            const markingLength = blockSize;
            const markingWidth = 0.2;
            
            const markingGeometry = new THREE.BoxGeometry(
                direction === 'x' ? markingLength : markingWidth,
                0.05,
                direction === 'x' ? markingWidth : markingLength
            );
            const markingMaterial = new THREE.MeshStandardMaterial({ color: 0xFFFFFF });
            
            const marking = new THREE.Mesh(markingGeometry, markingMaterial);
            marking.position.y = 0.025;
            marking.position.x = direction === 'x' ? x : z;
            marking.position.z = direction === 'x' ? z : x;
            
            roadGroup.add(marking);
        }
        
        function createTrafficLights(x, z, roadGroup) {
            const positions = [
                { x: x - roadWidth/2 - 1, z: z - roadWidth/2 - 1, rotation: Math.PI / 4 },
                { x: x + roadWidth/2 + 1, z: z - roadWidth/2 - 1, rotation: Math.PI * 3/4 },
                { x: x - roadWidth/2 - 1, z: z + roadWidth/2 + 1, rotation: -Math.PI / 4 },
                { x: x + roadWidth/2 + 1, z: z + roadWidth/2 + 1, rotation: -Math.PI * 3/4 }
            ];
            
            positions.forEach(pos => {
                const trafficLight = createTrafficLight();
                trafficLight.position.set(pos.x, 0, pos.z);
                trafficLight.rotation.y = pos.rotation;
                roadGroup.add(trafficLight);
            });
        }
        
        function createTrafficLight() {
            const trafficLightGroup = new THREE.Group();
            
            // Post
            const postGeometry = new THREE.CylinderGeometry(0.1, 0.1, 3, 8);
            const postMaterial = new THREE.MeshStandardMaterial({ color: 0x333333 });
            const post = new THREE.Mesh(postGeometry, postMaterial);
            post.position.y = 1.5;
            trafficLightGroup.add(post);
            
            // Light housing
            const housingGeometry = new THREE.BoxGeometry(0.5, 1.2, 0.3);
            const housingMaterial = new THREE.MeshStandardMaterial({ color: 0x111111 });
            const housing = new THREE.Mesh(housingGeometry, housingMaterial);
            housing.position.y = 3;
            trafficLightGroup.add(housing);
            
            // Lights
            const lightGeometry = new THREE.CircleGeometry(0.1, 16);
            const redLight = new THREE.Mesh(
                lightGeometry,
                new THREE.MeshStandardMaterial({ 
                    color: 0xFF0000,
                    emissive: 0xFF0000,
                    emissiveIntensity: 0.5
                })
            );
            redLight.position.set(0, 3.4, 0.16);
            redLight.rotation.y = Math.PI;
            trafficLightGroup.add(redLight);
            
            const yellowLight = new THREE.Mesh(
                lightGeometry,
                new THREE.MeshStandardMaterial({ 
                    color: 0xFFFF00,
                    emissive: 0xFFFF00,
                    emissiveIntensity: 0.5
                })
            );
            yellowLight.position.set(0, 3, 0.16);
            yellowLight.rotation.y = Math.PI;
            trafficLightGroup.add(yellowLight);
            
            const greenLight = new THREE.Mesh(
                lightGeometry,
                new THREE.MeshStandardMaterial({ 
                    color: 0x00FF00,
                    emissive: 0x00FF00,
                    emissiveIntensity: 0.5
                })
            );
            greenLight.position.set(0, 2.6, 0.16);
            greenLight.rotation.y = Math.PI;
            trafficLightGroup.add(greenLight);
            
            // Add traffic light state
            trafficLightGroup.userData.state = Math.floor(Math.random() * 3); // 0: red, 1: yellow, 2: green
            trafficLightGroup.userData.timer = Math.random() * 10;
            trafficLightGroup.userData.lights = [redLight, yellowLight, greenLight];
            
            return trafficLightGroup;
        }
        
        // -------- TRAFFIC & PEDESTRIANS --------
        function createVehicles() {
            const vehicles = new THREE.Group();
            
            // Create cars on east-west streets
            for (let x = -citySize/2; x < citySize/2; x += blockSize + roadWidth) {
                for (let z = -citySize/2 + roadWidth/4; z < citySize/2; z += blockSize + roadWidth) {
                    if (Math.random() > 0.7) {
                        const car = createCar();
                        car.position.set(citySize/2, 0.6, z);
                        car.rotation.y = Math.PI;
                        car.userData.direction = 'west';
                        car.userData.speed = 0.1 + Math.random() * 0.2;
                        vehicles.add(car);
                    }
                    
                    if (Math.random() > 0.7) {
                        const car = createCar();
                        car.position.set(-citySize/2, 0.6, z - roadWidth/2);
                        car.userData.direction = 'east';
                        car.userData.speed = 0.1 + Math.random() * 0.2;
                        vehicles.add(car);
                    }
                }
            }
            
            // Create cars on north-south streets
            for (let z = -citySize/2; z < citySize/2; z += blockSize + roadWidth) {
                for (let x = -citySize/2 + roadWidth/4; x < citySize/2; x += blockSize + roadWidth) {
                    if (Math.random() > 0.7) {
                        const car = createCar();
                        car.position.set(x, 0.6, citySize/2);
                        car.rotation.y = -Math.PI/2;
                        car.userData.direction = 'north';
                        car.userData.speed = 0.1 + Math.random() * 0.2;
                        vehicles.add(car);
                    }
                    
                    if (Math.random() > 0.7) {
                        const car = createCar();
                        car.position.set(x - roadWidth/2, 0.6, -citySize/2);
                        car.rotation.y = Math.PI/2;
                        car.userData.direction = 'south';
                        car.userData.speed = 0.1 + Math.random() * 0.2;
                        vehicles.add(car);
                    }
                }
            }
            
            scene.add(vehicles);
            return vehicles;
        }
        
        function createCar() {
            const carGroup = new THREE.Group();
            
            // Random car color
            const colors = [0xFF0000, 0x00FF00, 0x0000FF, 0xFFFF00, 0xFF00FF, 0x00FFFF, 0xFFFFFF, 0x000000];
            const carColor = colors[Math.floor(Math.random() * colors.length)];
            
            // Car body
            const bodyGeometry = new THREE.BoxGeometry(2, 0.6, 1);
            const bodyMaterial = new THREE.MeshStandardMaterial({ 
                color: carColor,
                roughness: 0.2,
                metalness: 0.8
            });
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.castShadow = true;
            carGroup.add(body);
            
            // Car top
            const topGeometry = new THREE.BoxGeometry(1.2, 0.4, 0.8);
            const top = new THREE.Mesh(topGeometry, bodyMaterial);
            top.position.set(-0.1, 0.5, 0);
            top.castShadow = true;
            carGroup.add(top);
            
            // Wheels
            const wheelGeometry = new THREE.CylinderGeometry(0.2, 0.2, 0.1, 16);
            const wheelMaterial = new THREE.MeshStandardMaterial({ color: 0x111111 });
            
            const wheels = [
                { x: 0.6, z: 0.5 },
                { x: 0.6, z: -0.5 },
                { x: -0.6, z: 0.5 },
                { x: -0.6, z: -0.5 }
            ];
            
            wheels.forEach(pos => {
                const wheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
                wheel.position.set(pos.x, -0.2, pos.z);
                wheel.rotation.z = Math.PI / 2;
                wheel.castShadow = true;
                carGroup.add(wheel);
            });
            
            // Headlights
            const headlightGeometry = new THREE.CircleGeometry(0.1, 16);
            const headlightMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xFFFFFF,
                emissive: 0xFFFFFF,
                emissiveIntensity: 1
            });
            
            const frontLight1 = new THREE.Mesh(headlightGeometry, headlightMaterial);
            frontLight1.position.set(1.01, 0.1, 0.3);
            frontLight1.rotation.y = Math.PI / 2;
            carGroup.add(frontLight1);
            
            const frontLight2 = new THREE.Mesh(headlightGeometry, headlightMaterial);
            frontLight2.position.set(1.01, 0.1, -0.3);
            frontLight2.rotation.y = Math.PI / 2;
            carGroup.add(frontLight2);
            
            // Taillights
            const taillightMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xFF0000,
                emissive: 0xFF0000,
                emissiveIntensity: 1
            });
            
            const backLight1 = new THREE.Mesh(headlightGeometry, taillightMaterial);
            backLight1.position.set(-1.01, 0.1, 0.3);
            backLight1.rotation.y = -Math.PI / 2;
            carGroup.add(backLight1);
            
            const backLight2 = new THREE.Mesh(headlightGeometry, taillightMaterial);
            backLight2.position.set(-1.01, 0.1, -0.3);
            backLight2.rotation.y = -Math.PI / 2;
            carGroup.add(backLight2);
            
            return carGroup;
        }
        
        function createPedestrians() {
            const pedestrians = new THREE.Group();
            
            // Create pedestrians on sidewalks
            for (let x = -citySize/2; x < citySize/2; x += blockSize + roadWidth) {
                for (let z = -citySize/2; z < citySize/2; z += blockSize + roadWidth) {
                    // Sidewalks around this block
                    if (Math.random() > 0.5) {
                        createPedestrianBatch(x, z, 'north', pedestrians);
                    }
                    if (Math.random() > 0.5) {
                        createPedestrianBatch(x, z, 'south', pedestrians);
                    }
                    if (Math.random() > 0.5) {
                        createPedestrianBatch(x, z, 'east', pedestrians);
                    }
                    if (Math.random() > 0.5) {
                        createPedestrianBatch(x, z, 'west', pedestrians);
                    }
                }
            }
            
            scene.add(pedestrians);
            return pedestrians;
        }
        
        function createPedestrianBatch(blockX, blockZ, side, pedestrians) {
            const count = 1 + Math.floor(Math.random() * 3);
            const sidewalkOffset = (blockSize / 2) + 3; // 3 units from the edge of the block
            
            for (let i = 0; i < count; i++) {
                let x, z, direction;
                
                switch(side) {
                    case 'north':
                        x = blockX + (Math.random() - 0.5) * blockSize;
                        z = blockZ - sidewalkOffset;
                        direction = Math.random() > 0.5 ? 'east' : 'west';
                        break;
                    case 'south':
                        x = blockX + (Math.random() - 0.5) * blockSize;
                        z = blockZ + sidewalkOffset;
                        direction = Math.random() > 0.5 ? 'east' : 'west';
                        break;
                    case 'east':
                        x = blockX + sidewalkOffset;
                        z = blockZ + (Math.random() - 0.5) * blockSize;
                        direction = Math.random() > 0.5 ? 'north' : 'south';
                        break;
                    case 'west':
                        x = blockX - sidewalkOffset;
                        z = blockZ + (Math.random() - 0.5) * blockSize;
                        direction = Math.random() > 0.5 ? 'north' : 'south';
                        break;
                }
                
                if (!isIntersection(x, z)) {
                    const pedestrian = createPedestrian();
                    pedestrian.position.set(x, 0, z);
                    
                    switch(direction) {
                        case 'north':
                            pedestrian.rotation.y = -Math.PI / 2;
                            break;
                        case 'south':
                            pedestrian.rotation.y = Math.PI / 2;
                            break;
                        case 'east':
                            pedestrian.rotation.y = 0;
                            break;
                        case 'west':
                            pedestrian.rotation.y = Math.PI;
                            break;
                    }
                    
                    pedestrian.userData.direction = direction;
                    pedestrian.userData.speed = 0.03 + Math.random() * 0.02;
                    pedestrian.userData.state = 'walking';
                    pedestrian.userData.waitTime = 0;
                    pedestrian.userData.blockX = blockX;
                    pedestrian.userData.blockZ = blockZ;
                    pedestrian.userData.side = side;
                    
                    pedestrians.add(pedestrian);
                }
            }
        }
        
        function createPedestrian() {
            const pedestrianGroup = new THREE.Group();
            
            // Random pedestrian color
            const bodyColors = [0x8B4513, 0xD2691E, 0xCD853F, 0xF5DEB3, 0xFFDEAD];
            const clothesColors = [0x000080, 0x8B0000, 0x006400, 0x4B0082, 0x800080, 0x000000];
            
            const bodyColor = bodyColors[Math.floor(Math.random() * bodyColors.length)];
            const clothesColor = clothesColors[Math.floor(Math.random() * clothesColors.length)];
            
            // Body
            const bodyGeometry = new THREE.CylinderGeometry(0.2, 0.2, 0.7, 8);
            const bodyMaterial = new THREE.MeshStandardMaterial({ color: clothesColor });
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.position.y = 0.6;
            body.castShadow = true;
            pedestrianGroup.add(body);
            
            // Head
            const headGeometry = new THREE.SphereGeometry(0.15, 16, 16);
            const headMaterial = new THREE.MeshStandardMaterial({ color: bodyColor });
            const head = new THREE.Mesh(headGeometry, headMaterial);
            head.position.y = 1.1;
            head.castShadow = true;
            pedestrianGroup.add(head);
            
            // Arms
            const armGeometry = new THREE.BoxGeometry(0.1, 0.4, 0.1);
            const armMaterial = new THREE.MeshStandardMaterial({ color: bodyColor });
            
            const leftArm = new THREE.Mesh(armGeometry, clothesColor);
            leftArm.position.set(0, 0.7, 0.2);
            leftArm.castShadow = true;
            pedestrianGroup.add(leftArm);
            
            const rightArm = new THREE.Mesh(armGeometry, clothesColor);
            rightArm.position.set(0, 0.7, -0.2);
            rightArm.castShadow = true;
            pedestrianGroup.add(rightArm);
            
            // Legs
            const legGeometry = new THREE.BoxGeometry(0.12, 0.4, 0.12);
            const legMaterial = new THREE.MeshStandardMaterial({ color: 0x000000 });
            
            const leftLeg = new THREE.Mesh(legGeometry, legMaterial);
            leftLeg.position.set(0, 0.2, 0.1);
            leftLeg.castShadow = true;
            pedestrianGroup.add(leftLeg);
            
            const rightLeg = new THREE.Mesh(legGeometry, legMaterial);
            rightLeg.position.set(0, 0.2, -0.1);
            rightLeg.castShadow = true;
            pedestrianGroup.add(rightLeg);
            
            // Animation parts
            pedestrianGroup.userData.animationParts = {
                leftLeg,
                rightLeg,
                leftArm,
                rightArm
            };
            
            return pedestrianGroup;
        }
        
        // -------- LIGHTING --------
        // Main lighting system
        const ambientLight = new THREE.AmbientLight(0xFFFFFF, 0.3);
        scene.add(ambientLight);
        
        const sunLight = new THREE.DirectionalLight(0xFFFFFF, 1);
        sunLight.position.set(50, 100, 50);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 10;
        sunLight.shadow.camera.far = 200;
        sunLight.shadow.camera.left = -100;
        sunLight.shadow.camera.right = 100;
        sunLight.shadow.camera.top = 100;
        sunLight.shadow.camera.bottom = -100;
        scene.add(sunLight);
        
        // Hemisphere light for sky/ground ambient
        const hemisphereLight = new THREE.HemisphereLight(0x87CEEB, 0x555555, 0.2);
        scene.add(hemisphereLight);
        
        // Create sky
        function createSky() {
            const skyGeometry = new THREE.SphereGeometry(500, 32, 32);
            const skyMaterial = new THREE.MeshBasicMaterial({
                color: 0x87CEEB,
                side: THREE.BackSide
            });
            const sky = new THREE.Mesh(skyGeometry, skyMaterial);
            scene.add(sky);
            return sky;
        }
        
        const sky = createSky();
        
        // Day/night cycle
        const timeSlider = document.getElementById('time-slider');
        const timeDisplay = document.getElementById('time-display');
        
        function updateDayNightCycle(time) {
            // Convert 24-hour time to rotation angle (0-24 to 0-2π)
            const angle = (time / 24) * Math.PI * 2 - Math.PI / 2;
            
            // Sun position on a circle in the sky
            const radius = 200;
            sunLight.position.x = Math.cos(angle) * radius;
            sunLight.position.y = Math.sin(angle) * radius;
            sunLight.position.z = 0;
            
            // Update time display
            const hours = Math.floor(time);
            const minutes = Math.floor((time - hours) * 60);
            timeDisplay.textContent = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}`;
            
            // Sky color based on time
            let skyColor, lightIntensity, ambientIntensity;
            
            if (time >= 6 && time <= 18) {
                // Daytime
                const dayProgress = Math.sin((time - 6) / 12 * Math.PI);
                skyColor = new THREE.Color(0x87CEEB).lerp(new THREE.Color(0x4169E1), 1 - dayProgress);
                lightIntensity = 0.8 + dayProgress * 0.2;
                ambientIntensity = 0.3 + dayProgress * 0.2;
                hemisphereLight.intensity = 0.2 + dayProgress * 0.3;
            } else {
                // Nighttime
                skyColor = new THREE.Color(0x000022);
                lightIntensity = 0.2;
                ambientIntensity = 0.1;
                hemisphereLight.intensity = 0.1;
            }
            
            sky.material.color = skyColor;
            sunLight.intensity = lightIntensity;
            ambientLight.intensity = ambientIntensity;
            
            // Update lamp lights based on time
            scene.traverse(object => {
                if (object.userData.isLampLightSource) {
                    // Lamps are brighter at night
                    if (time >= 18 || time <= 6) {
                        object.intensity = 0.7;
                    } else {
                        object.intensity = 0.1;
                    }
                }
                
                if (object.userData.isLampLight) {
                    // Lamp emissive intensity
                    if (time >= 18 || time <= 6) {
                        object.material.emissiveIntensity = 1;
                    } else {
                        object.material.emissiveIntensity = 0.2;
                    }
                }
            });
            
            // Update building windows
            scene.traverse(object => {
                if (object.material && object.material.emissive && 
                    object.parent && object.parent.parent && 
                    object.geometry && object.geometry.type === 'PlaneGeometry' && 
                    object.geometry.parameters.width === 1) {
                    
                    // This is probably a window
                    if (time >= 18 || time <= 6) {
                        // Night time - random window lights
                        if (Math.random() > 0.4) {
                            object.material.emissiveIntensity = 0.8 + Math.random() * 0.2;
                        } else {
                            object.material.emissiveIntensity = 0.1;
                        }
                    } else {
                        // Day time - dim windows
                        object.material.emissiveIntensity = 0.1;
                    }
                }
            });
        }
        
        timeSlider.addEventListener('input', function() {
            updateDayNightCycle(parseFloat(this.value));
        });
        
        // Initial time setting
        updateDayNightCycle(12);
        
        // -------- CAMERA CONTROLS --------
        // Simple camera controls
        const keys = {
            w: false,
            a: false,
            s: false,
            d: false,
            ArrowUp: false,
            ArrowDown: false,
            ArrowLeft: false,
            ArrowRight: false
        };
        
        window.addEventListener('keydown', (e) => {
            if (keys.hasOwnProperty(e.key)) {
                keys[e.key] = true;
            }
        });
        
        window.addEventListener('keyup', (e) => {
            if (keys.hasOwnProperty(e.key)) {
                keys[e.key] = false;
            }
        });
        
        // Mouse controls
        let mouseDown = false;
        let mouseX = 0;
        let mouseY = 0;
        let targetRotationX = 0;
        let targetRotationY = 0;
        const mouseSpeed = 0.003;
        
        window.addEventListener('mousedown', (e) => {
            mouseDown = true;
            mouseX = e.clientX;
            mouseY = e.clientY;
        });
        
        window.addEventListener('mouseup', () => {
            mouseDown = false;
        });
        
        window.addEventListener('mousemove', (e) => {
            if (mouseDown) {
                const deltaX = e.clientX - mouseX;
                const deltaY = e.clientY - mouseY;
                
                targetRotationX -= deltaX * mouseSpeed;
                targetRotationY = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, targetRotationY - deltaY * mouseSpeed));
                
                mouseX = e.clientX;
                mouseY = e.clientY;
            }
        });
        
        // Zoom controls
        window.addEventListener('wheel', (e) => {
            camera.position.y = Math.max(2, Math.min(100, camera.position.y + e.deltaY * 0.01));
        });
        
        // -------- ANIMATION & GAME LOOP --------
        function animate() {
            requestAnimationFrame(animate);
            
            // Handle camera movement
            const cameraSpeed = 0.5;
            const rotationSpeed = 0.02;
            
            // Gradually rotate to target rotation for smooth camera movement
            camera.rotation.y += (targetRotationX - camera.rotation.y) * 0.1;
            
            // Calculate forward direction based on camera rotation
            const forward = new THREE.Vector3(
                Math.sin(camera.rotation.y),
                0,
                Math.cos(camera.rotation.y)
            );
            
            // Calculate right direction (perpendicular to forward)
            const right = new THREE.Vector3(
                Math.sin(camera.rotation.y + Math.PI / 2),
                0,
                Math.cos(camera.rotation.y + Math.PI / 2)
            );
            
            // WASD movement
            if (keys.w) {
                camera.position.x += forward.x * cameraSpeed;
                camera.position.z += forward.z * cameraSpeed;
            }
            if (keys.s) {
                camera.position.x -= forward.x * cameraSpeed;
                camera.position.z -= forward.z * cameraSpeed;
            }
            if (keys.a) {
                camera.position.x -= right.x * cameraSpeed;
                camera.position.z -= right.z * cameraSpeed;
            }
            if (keys.d) {
                camera.position.x += right.x * cameraSpeed;
                camera.position.z += right.z * cameraSpeed;
            }
            
            // Arrow keys for rotation
            if (keys.ArrowLeft) {
                targetRotationX += rotationSpeed;
            }
            if (keys.ArrowRight) {
                targetRotationX -= rotationSpeed;
            }
            if (keys.ArrowUp) {
                targetRotationY = Math.max(-Math.PI / 2, targetRotationY - rotationSpeed);
            }
            if (keys.ArrowDown) {
                targetRotationY = Math.min(Math.PI / 2, targetRotationY + rotationSpeed);
            }
            
            // Keep camera within city bounds
            const maxBound = citySize / 2;
            camera.position.x = Math.max(-maxBound, Math.min(maxBound, camera.position.x));
            camera.position.z = Math.max(-maxBound, Math.min(maxBound, camera.position.z));
            
            // Animate vehicles
            scene.traverse(object => {
                if (object.userData.direction) {
                    let speedMultiplier = 1;
                    
                    // Check for traffic lights if near intersection
                    if (object.userData.direction === 'east' || object.userData.direction === 'west') {
                        // Check if near intersection on X axis
                        const xMod = Math.abs(object.position.x) % (blockSize + roadWidth);
                        if (xMod < 3 || xMod > blockSize + roadWidth - 3) {
                            // Find nearest traffic light
                            scene.traverse(trafficLight => {
                                if (trafficLight.userData.state !== undefined && 
                                    Math.abs(trafficLight.position.x - object.position.x) < 5 &&
                                    Math.abs(trafficLight.position.z - object.position.z) < 5) {
                                    
                                    // Red light
                                    if (trafficLight.userData.state === 0) {
                                        speedMultiplier = 0;
                                    }
                                    // Yellow light
                                    else if (trafficLight.userData.state === 1) {
                                        speedMultiplier = 0.3;
                                    }
                                }
                            });
                        }
                    }
                    else if (object.userData.direction === 'north' || object.userData.direction === 'south') {
                        // Check if near intersection on Z axis
                        const zMod = Math.abs(object.position.z) % (blockSize + roadWidth);
                        if (zMod < 3 || zMod > blockSize + roadWidth - 3) {
                            // Find nearest traffic light
                            scene.traverse(trafficLight => {
                                if (trafficLight.userData.state !== undefined && 
                                    Math.abs(trafficLight.position.x - object.position.x) < 5 &&
                                    Math.abs(trafficLight.position.z - object.position.z) < 5) {
                                    
                                    // Red light
                                    if (trafficLight.userData.state === 0) {
                                        speedMultiplier = 0;
                                    }
                                    // Yellow light
                                    else if (trafficLight.userData.state === 1) {
                                        speedMultiplier = 0.3;
                                    }
                                }
                            });
                        }
                    }
                    
                    // Move the vehicle
                    const speed = object.userData.speed * speedMultiplier;
                    
                    if (object.userData.direction === 'east') {
                        object.position.x += speed;
                        if (object.position.x > citySize/2) {
                            object.position.x = -citySize/2;
                        }
                    } else if (object.userData.direction === 'west') {
                        object.position.x -= speed;
                        if (object.position.x < -citySize/2) {
                            object.position.x = citySize/2;
                        }
                    } else if (object.userData.direction === 'north') {
                        object.position.z -= speed;
                        if (object.position.z < -citySize/2) {
                            object.position.z = citySize/2;
                        }
                    } else if (object.userData.direction === 'south') {
                        object.position.z += speed;
                        if (object.position.z > citySize/2) {
                            object.position.z = -citySize/2;
                        }
                    }
                    
                    // Animate pedestrians
                    if (object.userData.animationParts) {
                        const parts = object.userData.animationParts;
                        const walkCycle = Date.now() * 0.01;
                        
                        if (object.userData.state === 'walking') {
                            parts.leftLeg.rotation.x = Math.sin(walkCycle) * 0.5;
                            parts.rightLeg.rotation.x = Math.sin(walkCycle + Math.PI) * 0.5;
                            parts.leftArm.rotation.x = Math.sin(walkCycle + Math.PI) * 0.3;
                            parts.rightArm.rotation.x = Math.sin(walkCycle) * 0.3;
                        } else {
                            // Reset to standing position
                            parts.leftLeg.rotation.x = 0;
                            parts.rightLeg.rotation.x = 0;
                            parts.leftArm.rotation.x = 0;
                            parts.rightArm.rotation.x = 0;
                        }
                        
                        // Handle pedestrian behavior near intersections
                        if (object.userData.direction === 'east' || object.userData.direction === 'west') {
                            // Check if near intersection on X axis
                            const xMod = Math.abs(object.position.x) % (blockSize + roadWidth);
                            if (xMod > blockSize - 2 && xMod < blockSize + 2) {
                                // Set waiting state randomly
                                if (object.userData.state === 'walking' && Math.random() > 0.99) {
                                    object.userData.state = 'waiting';
                                    object.userData.waitTime = 50 + Math.random() * 100;
                                }
                                
                                // Wait for some time
                                if (object.userData.state === 'waiting') {
                                    object.userData.waitTime--;
                                    if (object.userData.waitTime <= 0) {
                                        object.userData.state = 'walking';
                                    }
                                }
                            }
                        }
                        else if (object.userData.direction === 'north' || object.userData.direction === 'south') {
                            // Check if near intersection on Z axis
                            const zMod = Math.abs(object.position.z) % (blockSize + roadWidth);
                            if (zMod > blockSize - 2 && zMod < blockSize + 2) {
                                // Set waiting state randomly
                                if (object.userData.state === 'walking' && Math.random() > 0.99) {
                                    object.userData.state = 'waiting';
                                    object.userData.waitTime = 50 + Math.random() * 100;
                                }
                                
                                // Wait for some time
                                if (object.userData.state === 'waiting') {
                                    object.userData.waitTime--;
                                    if (object.userData.waitTime <= 0) {
                                        object.userData.state = 'walking';
                                    }
                                }
                            }
                        }
                    }
                }
            });
            
            // Update traffic lights
            scene.traverse(object => {
                if (object.userData.lights) {
                    // Update traffic light timers
                    if (object.userData.timer > 0) {
                        object.userData.timer--;
                    } else {
                        // Change state
                        object.userData.state = (object.userData.state + 1) % 3;
                        
                        // Set timer based on state
                        switch(object.userData.state) {
                            case 0: // Red
                                object.userData.timer = 150;
                                break;
                            case 1: // Yellow
                                object.userData.timer = 50;
                                break;
                            case 2: // Green
                                object.userData.timer = 150;
                                break;
                        }
                    }
                    
                    // Update light appearance
                    for (let i = 0; i < object.userData.lights.length; i++) {
                        if (i === object.userData.state) {
                            object.userData.lights[i].material.emissiveIntensity = 1;
                        } else {
                            object.userData.lights[i].material.emissiveIntensity = 0.1;
                        }
                    }
                }
            });
            
            renderer.render(scene, camera);
        }
        
        // -------- INITIALIZE CITY --------
        // Generate city components
        generateCity();
        createRoads();
        const vehicles = createVehicles();
        const pedestrians = createPedestrians();
        
        // Start animation loop
        animate();
    </script>
</body>
</html>
