<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>3D City Scene</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            color: white;
            font-family: Arial, sans-serif;
            text-shadow: 1px 1px 2px black;
            z-index: 100;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="info">3D City Scene - Click and drag to look around | WASD to move | Q/E to cycle time</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Initialize Three.js scene
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Setup camera
        camera.position.set(0, 30, 50);
        camera.lookAt(0, 0, 0);

        // Add lights
        const ambientLight = new THREE.AmbientLight(0x404040);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 1);
        sunLight.position.set(50, 100, 50);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 1024;
        sunLight.shadow.mapSize.height = 1024;
        scene.add(sunLight);

        // City parameters
        const citySize = 100;
        const buildingCount = 50;
        const roadWidth = 10;
        const blockSize = 30;

        // Create ground
        const groundGeometry = new THREE.PlaneGeometry(citySize * 2, citySize * 2);
        const groundMaterial = new THREE.MeshStandardMaterial({ color: 0x1a3300, roughness: 0.8 });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Create roads
        function createRoads() {
            const roadMaterial = new THREE.MeshStandardMaterial({ color: 0x333333 });
            
            // Main roads
            for (let i = -citySize; i <= citySize; i += blockSize + roadWidth) {
                // Horizontal roads
                const hRoadGeometry = new THREE.PlaneGeometry(citySize * 2, roadWidth);
                const hRoad = new THREE.Mesh(hRoadGeometry, roadMaterial);
                hRoad.rotation.x = -Math.PI / 2;
                hRoad.position.set(0, 0.01, i);
                hRoad.receiveShadow = true;
                scene.add(hRoad);
                
                // Vertical roads
                const vRoadGeometry = new THREE.PlaneGeometry(roadWidth, citySize * 2);
                const vRoad = new THREE.Mesh(vRoadGeometry, roadMaterial);
                vRoad.rotation.x = -Math.PI / 2;
                vRoad.position.set(i, 0.01, 0);
                vRoad.receiveShadow = true;
                scene.add(vRoad);
                
                // Create road markings
                createRoadMarkings(i, 0, true); // Horizontal
                createRoadMarkings(0, i, false); // Vertical
            }
        }

        // Road markings
        function createRoadMarkings(x, z, isHorizontal) {
            const markerMaterial = new THREE.MeshStandardMaterial({ color: 0xFFFFFF });
            
            if (isHorizontal) {
                for (let i = -citySize + 5; i < citySize; i += 10) {
                    const markerGeometry = new THREE.PlaneGeometry(3, 0.5);
                    const marker = new THREE.Mesh(markerGeometry, markerMaterial);
                    marker.rotation.x = -Math.PI / 2;
                    marker.position.set(i, 0.02, z);
                    marker.receiveShadow = true;
                    scene.add(marker);
                }
            } else {
                for (let i = -citySize + 5; i < citySize; i += 10) {
                    const markerGeometry = new THREE.PlaneGeometry(0.5, 3);
                    const marker = new THREE.Mesh(markerGeometry, markerMaterial);
                    marker.rotation.x = -Math.PI / 2;
                    marker.position.set(x, 0.02, i);
                    marker.receiveShadow = true;
                    scene.add(marker);
                }
            }
        }

        // Create buildings
        function createBuildings() {
            for (let x = -citySize; x < citySize; x += blockSize + roadWidth) {
                for (let z = -citySize; z < citySize; z += blockSize + roadWidth) {
                    // Skip some blocks randomly to create variation
                    if (Math.random() < 0.2) continue;
                    
                    const blockType = Math.random();
                    
                    if (blockType < 0.6) {
                        // Regular building block
                        createBuildingBlock(x, z);
                    } else if (blockType < 0.8) {
                        // Park
                        createPark(x, z);
                    } else {
                        // Skyscraper area
                        createSkyscraper(x, z);
                    }
                }
            }
        }

        // Create a block of buildings
        function createBuildingBlock(blockX, blockZ) {
            const buildingsPerBlock = 4;
            const buildingSize = (blockSize - (buildingsPerBlock - 1) * 2) / buildingsPerBlock;
            
            for (let i = 0; i < buildingsPerBlock; i++) {
                for (let j = 0; j < buildingsPerBlock; j++) {
                    // Skip some buildings randomly
                    if (Math.random() < 0.3) continue;
                    
                    const x = blockX - blockSize/2 + i * (buildingSize + 2) + buildingSize/2;
                    const z = blockZ - blockSize/2 + j * (buildingSize + 2) + buildingSize/2;
                    
                    createBuilding(x, z, buildingSize);
                }
            }
        }

        // Create a single building
        function createBuilding(x, z, size) {
            const height = 5 + Math.random() * 15;
            const color = new THREE.Color(0.5 + Math.random() * 0.5, 0.5 + Math.random() * 0.5, 0.5 + Math.random() * 0.5);
            
            // Main building
            const buildingGeometry = new THREE.BoxGeometry(size, height, size);
            const buildingMaterial = new THREE.MeshStandardMaterial({ 
                color: color,
                roughness: 0.7
            });
            const building = new THREE.Mesh(buildingGeometry, buildingMaterial);
            building.position.set(x, height/2, z);
            building.castShadow = true;
            building.receiveShadow = true;
            scene.add(building);
            
            // Windows
            addWindows(building, size, height);
            
            // Roof elements (sometimes)
            if (Math.random() > 0.5) {
                addRoofElements(x, height, z, size);
            }
        }

        // Add windows to a building
        function addWindows(building, size, height) {
            const windowSize = 0.8;
            const windowSpacing = 1.5;
            const windowsPerSide = Math.floor(size / windowSpacing);
            const floorsCount = Math.floor(height / windowSpacing);
            
            const windowGeometry = new THREE.PlaneGeometry(windowSize, windowSize);
            const windowMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xFFFFFF,
                emissive: new THREE.Color(0.1, 0.1, 0.1),
                transparent: true,
                opacity: 0.7
            });
            
            // Windows on front and back
            for (let floor = 0; floor < floorsCount; floor++) {
                for (let w = 0; w < windowsPerSide; w++) {
                    // Skip some windows randomly
                    if (Math.random() < 0.2) continue;
                    
                    const wx = -size/2 + w * windowSpacing + windowSpacing/2;
                    const wy = floor * windowSpacing + windowSpacing;
                    
                    // Front windows
                    const frontWindow = new THREE.Mesh(windowGeometry, windowMaterial);
                    frontWindow.position.set(wx, wy, size/2 + 0.01);
                    building.add(frontWindow);
                    
                    // Back windows
                    const backWindow = new THREE.Mesh(windowGeometry, windowMaterial);
                    backWindow.position.set(wx, wy, -size/2 - 0.01);
                    backWindow.rotation.y = Math.PI;
                    building.add(backWindow);
                }
            }
            
            // Windows on sides
            for (let floor = 0; floor < floorsCount; floor++) {
                for (let w = 0; w < windowsPerSide; w++) {
                    // Skip some windows randomly
                    if (Math.random() < 0.2) continue;
                    
                    const wz = -size/2 + w * windowSpacing + windowSpacing/2;
                    const wy = floor * windowSpacing + windowSpacing;
                    
                    // Left windows
                    const leftWindow = new THREE.Mesh(windowGeometry, windowMaterial);
                    leftWindow.position.set(-size/2 - 0.01, wy, wz);
                    leftWindow.rotation.y = -Math.PI / 2;
                    building.add(leftWindow);
                    
                    // Right windows
                    const rightWindow = new THREE.Mesh(windowGeometry, windowMaterial);
                    rightWindow.position.set(size/2 + 0.01, wy, wz);
                    rightWindow.rotation.y = Math.PI / 2;
                    building.add(rightWindow);
                }
            }
        }

        // Add elements to building roofs
        function addRoofElements(x, buildingHeight, z, buildingSize) {
            // Water tower
            if (Math.random() > 0.7) {
                const towerGeometry = new THREE.CylinderGeometry(buildingSize/6, buildingSize/6, buildingSize/3, 8);
                const towerMaterial = new THREE.MeshStandardMaterial({ color: 0x888888 });
                const tower = new THREE.Mesh(towerGeometry, towerMaterial);
                tower.position.set(x, buildingHeight + buildingSize/6, z);
                tower.castShadow = true;
                scene.add(tower);
                
                // Supports for water tower
                const supportGeometry = new THREE.CylinderGeometry(0.2, 0.2, buildingSize/6, 4);
                const supportMaterial = new THREE.MeshStandardMaterial({ color: 0x444444 });
                
                for (let i = 0; i < 4; i++) {
                    const angle = i * Math.PI / 2;
                    const supportX = x + Math.cos(angle) * buildingSize/4;
                    const supportZ = z + Math.sin(angle) * buildingSize/4;
                    
                    const support = new THREE.Mesh(supportGeometry, supportMaterial);
                    support.position.set(supportX, buildingHeight + buildingSize/12, supportZ);
                    support.castShadow = true;
                    scene.add(support);
                }
            }
            
            // AC Units
            else if (Math.random() > 0.5) {
                const acCount = Math.floor(Math.random() * 3) + 1;
                
                for (let i = 0; i < acCount; i++) {
                    const acSize = 1 + Math.random();
                    const acGeometry = new THREE.BoxGeometry(acSize, acSize, acSize);
                    const acMaterial = new THREE.MeshStandardMaterial({ color: 0x999999 });
                    const ac = new THREE.Mesh(acGeometry, acMaterial);
                    
                    const offsetX = (Math.random() - 0.5) * buildingSize * 0.7;
                    const offsetZ = (Math.random() - 0.5) * buildingSize * 0.7;
                    
                    ac.position.set(x + offsetX, buildingHeight + acSize/2, z + offsetZ);
                    ac.castShadow = true;
                    scene.add(ac);
                }
            }
        }

        // Create skyscrapers
        function createSkyscraper(x, z) {
            const width = 10 + Math.random() * 5;
            const depth = 10 + Math.random() * 5;
            const height = 40 + Math.random() * 30;
            
            // Base color
            const baseColor = new THREE.Color(
                0.3 + Math.random() * 0.2,
                0.3 + Math.random() * 0.2,
                0.3 + Math.random() * 0.2
            );
            
            // Main structure
            const geometry = new THREE.BoxGeometry(width, height, depth);
            const material = new THREE.MeshStandardMaterial({ 
                color: baseColor,
                roughness: 0.3,
                metalness: 0.8
            });
            
            const skyscraper = new THREE.Mesh(geometry, material);
            skyscraper.position.set(x, height/2, z);
            skyscraper.castShadow = true;
            skyscraper.receiveShadow = true;
            scene.add(skyscraper);
            
            // Create windows
            createSkyscraperWindows(skyscraper, width, depth, height);
            
            // Add antenna or spire to some skyscrapers
            if (Math.random() > 0.6) {
                const spireHeight = 5 + Math.random() * 10;
                const spireGeometry = new THREE.CylinderGeometry(0.5, 0.5, spireHeight, 8);
                const spireMaterial = new THREE.MeshStandardMaterial({ color: 0x888888 });
                const spire = new THREE.Mesh(spireGeometry, spireMaterial);
                spire.position.set(x, height + spireHeight/2, z);
                spire.castShadow = true;
                scene.add(spire);
            }
        }

        // Create windows for skyscrapers
        function createSkyscraperWindows(skyscraper, width, depth, height) {
            const windowGeometry = new THREE.PlaneGeometry(0.5, 0.8);
            const glassMaterial = new THREE.MeshStandardMaterial({
                color: 0xADDEFF,
                transparent: true,
                opacity: 0.7,
                emissive: new THREE.Color(0.1, 0.1, 0.2)
            });
            
            const windowSpacing = 1.5;
            const floorsCount = Math.floor(height / windowSpacing);
            const windowsPerWidth = Math.floor(width / windowSpacing);
            const windowsPerDepth = Math.floor(depth / windowSpacing);
            
            // Add windows to front and back
            for (let floor = 1; floor < floorsCount; floor++) {
                for (let w = 0; w < windowsPerWidth; w++) {
                    const wx = -width/2 + w * windowSpacing + windowSpacing/2;
                    const wy = floor * windowSpacing;
                    
                    // Front
                    const frontWindow = new THREE.Mesh(windowGeometry, glassMaterial);
                    frontWindow.position.set(wx, wy, depth/2 + 0.01);
                    skyscraper.add(frontWindow);
                    
                    // Back
                    const backWindow = new THREE.Mesh(windowGeometry, glassMaterial);
                    backWindow.position.set(wx, wy, -depth/2 - 0.01);
                    backWindow.rotation.y = Math.PI;
                    skyscraper.add(backWindow);
                }
            }
            
            // Add windows to left and right
            for (let floor = 1; floor < floorsCount; floor++) {
                for (let w = 0; w < windowsPerDepth; w++) {
                    const wz = -depth/2 + w * windowSpacing + windowSpacing/2;
                    const wy = floor * windowSpacing;
                    
                    // Left
                    const leftWindow = new THREE.Mesh(windowGeometry, glassMaterial);
                    leftWindow.position.set(-width/2 - 0.01, wy, wz);
                    leftWindow.rotation.y = -Math.PI / 2;
                    skyscraper.add(leftWindow);
                    
                    // Right
                    const rightWindow = new THREE.Mesh(windowGeometry, glassMaterial);
                    rightWindow.position.set(width/2 + 0.01, wy, wz);
                    rightWindow.rotation.y = Math.PI / 2;
                    skyscraper.add(rightWindow);
                }
            }
        }

        // Create park
        function createPark(x, z) {
            // Create grass
            const grassGeometry = new THREE.PlaneGeometry(blockSize, blockSize);
            const grassMaterial = new THREE.MeshStandardMaterial({ color: 0x33AA33 });
            const grass = new THREE.Mesh(grassGeometry, grassMaterial);
            grass.rotation.x = -Math.PI / 2;
            grass.position.set(x, 0.02, z);
            grass.receiveShadow = true;
            scene.add(grass);
            
            // Add trees
            const treeCount = 3 + Math.floor(Math.random() * 5);
            for (let i = 0; i < treeCount; i++) {
                const tx = x + (Math.random() - 0.5) * blockSize * 0.8;
                const tz = z + (Math.random() - 0.5) * blockSize * 0.8;
                createTree(tx, tz);
            }
            
            // Add benches
            const benchCount = Math.floor(Math.random() * 3);
            for (let i = 0; i < benchCount; i++) {
                const bx = x + (Math.random() - 0.5) * blockSize * 0.7;
                const bz = z + (Math.random() - 0.5) * blockSize * 0.7;
                createBench(bx, bz);
            }
            
            // Add a lamp post
            if (Math.random() > 0.5) {
                const lx = x + (Math.random() - 0.5) * blockSize * 0.6;
                const lz = z + (Math.random() - 0.5) * blockSize * 0.6;
                createLampPost(lx, lz);
            }
            
            // Add a fountain or statue (sometimes)
            if (Math.random() > 0.7) {
                createFountain(x, z);
            }
        }

        // Create a tree
        function createTree(x, z) {
            // Tree trunk
            const trunkGeometry = new THREE.CylinderGeometry(0.2, 0.4, 2, 6);
            const trunkMaterial = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
            const trunk = new THREE.Mesh(trunkGeometry, trunkMaterial);
            trunk.position.set(x, 1, z);
            trunk.castShadow = true;
            scene.add(trunk);
            
            // Tree foliage
            const foliageGeometry = new THREE.SphereGeometry(1.5, 8, 8);
            const foliageMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x228B22,
                roughness: 1
            });
            const foliage = new THREE.Mesh(foliageGeometry, foliageMaterial);
            foliage.position.set(x, 3, z);
            foliage.castShadow = true;
            scene.add(foliage);
        }

        // Create a bench
        function createBench(x, z) {
            // Rotate randomly
            const rotation = Math.random() * Math.PI * 2;
            
            // Bench seat
            const seatGeometry = new THREE.BoxGeometry(2, 0.2, 0.8);
            const seatMaterial = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
            const seat = new THREE.Mesh(seatGeometry, seatMaterial);
            seat.position.set(x, 0.6, z);
            seat.rotation.y = rotation;
            seat.castShadow = true;
            scene.add(seat);
            
            // Bench legs
            const legGeometry = new THREE.BoxGeometry(0.1, 0.5, 0.8);
            const legMaterial = new THREE.MeshStandardMaterial({ color: 0x333333 });
            
            // Create four legs
            for (let i = -1; i <= 1; i += 2) {
                const legX = x + Math.cos(rotation) * i * 0.8;
                const legZ = z + Math.sin(rotation) * i * 0.8;
                
                const leg = new THREE.Mesh(legGeometry, legMaterial);
                leg.position.set(legX, 0.25, legZ);
                leg.rotation.y = rotation;
                leg.castShadow = true;
                scene.add(leg);
            }
            
            // Back rest
            const backGeometry = new THREE.BoxGeometry(2, 0.8, 0.2);
            const backMaterial = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
            const back = new THREE.Mesh(backGeometry, backMaterial);
            
            const backX = x - Math.sin(rotation) * 0.3;
            const backZ = z + Math.cos(rotation) * 0.3;
            
            back.position.set(backX, 1, backZ);
            back.rotation.y = rotation;
            back.castShadow = true;
            scene.add(back);
        }

        // Create lamp post
        function createLampPost(x, z) {
            // Post
            const postGeometry = new THREE.CylinderGeometry(0.1, 0.1, 6, 8);
            const postMaterial = new THREE.MeshStandardMaterial({ color: 0x222222 });
            const post = new THREE.Mesh(postGeometry, postMaterial);
            post.position.set(x, 3, z);
            post.castShadow = true;
            scene.add(post);
            
            // Lamp
            const lampGeometry = new THREE.SphereGeometry(0.3, 8, 8);
            const lampMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xFFFF00,
                emissive: 0xFFFF00,
                emissiveIntensity: 0.5
            });
            const lamp = new THREE.Mesh(lampGeometry, lampMaterial);
            lamp.position.set(x, 6, z);
            scene.add(lamp);
            
            // Light
            const light = new THREE.PointLight(0xFFFFAA, 0.8, 15);
            light.position.set(x, 6, z);
            scene.add(light);
            
            // Add to lights array for day/night cycle
            streetLights.push({ light, lamp });
        }

        // Create a fountain
        function createFountain(x, z) {
            // Base
            const baseGeometry = new THREE.CylinderGeometry(3, 3.5, 0.5, 16);
            const baseMaterial = new THREE.MeshStandardMaterial({ color: 0x999999 });
            const base = new THREE.Mesh(baseGeometry, baseMaterial);
            base.position.set(x, 0.25, z);
            base.receiveShadow = true;
            scene.add(base);
            
            // Water basin
            const basinGeometry = new THREE.CylinderGeometry(2.8, 2.8, 0.4, 16);
            const basinMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x3399FF,
                transparent: true,
                opacity: 0.7
            });
            const basin = new THREE.Mesh(basinGeometry, basinMaterial);
            basin.position.set(x, 0.55, z);
            scene.add(basin);
            
            // Center pillar
            const pillarGeometry = new THREE.CylinderGeometry(0.5, 0.5, 1.5, 8);
            const pillarMaterial = new THREE.MeshStandardMaterial({ color: 0x888888 });
            const pillar = new THREE.Mesh(pillarGeometry, pillarMaterial);
            pillar.position.set(x, 1.25, z);
            pillar.castShadow = true;
            scene.add(pillar);
        }

        // Create traffic lights
        function createTrafficLights() {
            // Place traffic lights at intersections
            for (let x = -citySize + roadWidth/2; x < citySize; x += blockSize + roadWidth) {
                for (let z = -citySize + roadWidth/2; z < citySize; z += blockSize + roadWidth) {
                    // Skip some intersections
                    if (Math.random() < 0.5) continue;
                    
                    // Create traffic light at intersection corners
                    createTrafficLight(x + roadWidth/2 - 1, z + roadWidth/2 - 1, Math.PI/4);
                    createTrafficLight(x - roadWidth/2 + 1, z + roadWidth/2 - 1, Math.PI*3/4);
                    createTrafficLight(x - roadWidth/2 + 1, z - roadWidth/2 + 1, Math.PI*5/4);
                    createTrafficLight(x + roadWidth/2 - 1, z - roadWidth/2 + 1, Math.PI*7/4);
                    
                    // Create pedestrian crossing
                    createCrossing(x, z);
                }
            }
        }

        // Create a traffic light
        function createTrafficLight(x, z, rotation) {
            // Post
            const postGeometry = new THREE.CylinderGeometry(0.1, 0.1, 4, 6);
            const postMaterial = new THREE.MeshStandardMaterial({ color: 0x222222 });
            const post = new THREE.Mesh(postGeometry, postMaterial);
            post.position.set(x, 2, z);
            post.castShadow = true;
            scene.add(post);
            
            // Light box
            const boxGeometry = new THREE.BoxGeometry(0.4, 1, 0.4);
            const boxMaterial = new THREE.MeshStandardMaterial({ color: 0x333333 });
            const box = new THREE.Mesh(boxGeometry, boxMaterial);
            
            const boxX = x + Math.cos(rotation) * 0.6;
            const boxZ = z + Math.sin(rotation) * 0.6;
            
            box.position.set(boxX, 3.5, boxZ);
            box.rotation.y = rotation - Math.PI;
            box.castShadow = true;
            scene.add(box);
            
            // Lights
            const colors = [0xFF0000, 0xFFFF00, 0x00FF00];
            const lightGeometry = new THREE.CircleGeometry(0.12, 8);
            
            for (let i = 0; i < 3; i++) {
                const lightMesh = new THREE.Mesh(
                    lightGeometry,
                    new THREE.MeshBasicMaterial({ color: colors[i] })
                );
                
                lightMesh.position.set(0, 0.3 - i * 0.3, 0.21);
                lightMesh.rotation.y = Math.PI;
                box.add(lightMesh);
            }
            
            // Add to traffic lights array
            trafficLights.push({
                box,
                rotation,
                state: Math.floor(Math.random() * 3),
                timer: Math.random() * 20
            });
        }

        // Create pedestrian crossing
        function createCrossing(x, z) {
            const stripeWidth = 0.6;
            const stripeLength = roadWidth - 2;
            const stripesCount = 6;
            
            const stripeMaterial = new THREE.MeshStandardMaterial({ color: 0xFFFFFF });
            
            // Horizontal crossing (along z-axis)
            for (let i = 0; i < stripesCount; i++) {
                const stripeGeometry = new THREE.PlaneGeometry(stripeWidth, stripeLength);
                const stripe = new THREE.Mesh(stripeGeometry, stripeMaterial);
                stripe.rotation.x = -Math.PI / 2;
                
                const stripeX = x + (i - stripesCount/2 + 0.5) * stripeWidth * 1.5;
                stripe.position.set(stripeX, 0.03, z);
                stripe.receiveShadow = true;
                scene.add(stripe);
            }
            
            // Vertical crossing (along x-axis)
            for (let i = 0; i < stripesCount; i++) {
                const stripeGeometry = new THREE.PlaneGeometry(stripeLength, stripeWidth);
                const stripe = new THREE.Mesh(stripeGeometry, stripeMaterial);
                stripe.rotation.x = -Math.PI / 2;
                
                const stripeZ = z + (i - stripesCount/2 + 0.5) * stripeWidth * 1.5;
                stripe.position.set(x, 0.03, stripeZ);
                stripe.receiveShadow = true;
                scene.add(stripe);
            }
        }

        // Cars
        const cars = [];
        function createCars() {
            const carCount = 30;
            
            for (let i = 0; i < carCount; i++) {
                // Determine road position
                const onHorizontalRoad = Math.random() > 0.5;
                let x, z;
                let lane, direction;
                
                if (onHorizontalRoad) {
                    // Car on horizontal road
                    z = -citySize + Math.floor((citySize * 2) / (blockSize + roadWidth)) * (blockSize + roadWidth) * Math.random();
                    z = Math.round(z / (blockSize + roadWidth)) * (blockSize + roadWidth);
                    
                    // Position on road (left or right lane)
                    lane = Math.random() > 0.5 ? 1 : -1;
                    x = -citySize + Math.random() * citySize * 2;
                    x = Math.min(Math.max(x, -citySize), citySize);
                    
                    // Direction - positive for east, negative for west
                    direction = lane > 0 ? 1 : -1;
                    
                    // Offset from center of road
                    z += lane * 2;
                } else {
                    // Car on vertical road
                    x = -citySize + Math.floor((citySize * 2) / (blockSize + roadWidth)) * (blockSize + roadWidth) * Math.random();
                    x = Math.round(x / (blockSize + roadWidth)) * (blockSize + roadWidth);
                    
                    // Position on road (left or right lane)
                    lane = Math.random() > 0.5 ? 1 : -1;
                    z = -citySize + Math.random() * citySize * 2;
                    z = Math.min(Math.max(z, -citySize), citySize);
                    
                    // Direction - positive for south, negative for north
                    direction = lane > 0 ? 1 : -1;
                    
                    // Offset from center of road
                    x += lane * 2;
                }
                
                // Create car with random color
                const randomColor = new THREE.Color(Math.random(), Math.random(), Math.random());
                const car = createCar(randomColor);
                
                // Position car
                car.position.set(x, 0.6, z);
                car.rotation.y = onHorizontalRoad ? 
                    (lane > 0 ? Math.PI / 2 : -Math.PI / 2) : 
                    (lane > 0 ? 0 : Math.PI);
                
                // Add to cars array with movement data
                cars.push({
                    mesh: car,
                    speed: 0.1 + Math.random() * 0.2,
                    onHorizontalRoad,
                    direction
                });
                
                scene.add(car);
            }
        }
        
        // Create a car mesh
        function createCar(color) {
            const car = new THREE.Group();
            
            // Car body
            const bodyGeometry = new THREE.BoxGeometry(2, 0.5, 4);
            const bodyMaterial = new THREE.MeshStandardMaterial({ 
                color: color,
                metalness: 0.5,
                roughness: 0.2
            });
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.position.y = 0.5;
            body.castShadow = true;
            car.add(body);
            
            // Car cabin
            const cabinGeometry = new THREE.BoxGeometry(1.7, 0.5, 2);
            const cabinMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x444444,
                metalness: 0.7,
                roughness: 0.2
            });
            const cabin = new THREE.Mesh(cabinGeometry, cabinMaterial);
            cabin.position.set(0, 1, -0.2);
            cabin.castShadow = true;
            car.add(cabin);
            
            // Wheels
            const wheelGeometry = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 8);
            const wheelMaterial = new THREE.MeshStandardMaterial({ color: 0x333333 });
            
            // Front-left wheel
            const wheel1 = new THREE.Mesh(wheelGeometry, wheelMaterial);
            wheel1.rotation.z = Math.PI / 2;
            wheel1.position.set(-1, 0.4, 1);
            car.add(wheel1);
            
            // Front-right wheel
            const wheel2 = new THREE.Mesh(wheelGeometry, wheelMaterial);
            wheel2.rotation.z = Math.PI / 2;
            wheel2.position.set(1, 0.4, 1);
            car.add(wheel2);
            
            // Rear-left wheel
            const wheel3 = new THREE.Mesh(wheelGeometry, wheelMaterial);
            wheel3.rotation.z = Math.PI / 2;
            wheel3.position.set(-1, 0.4, -1);
            car.add(wheel3);
            
            // Rear-right wheel
            const wheel4 = new THREE.Mesh(wheelGeometry, wheelMaterial);
            wheel4.rotation.z = Math.PI / 2;
            wheel4.position.set(1, 0.4, -1);
            car.add(wheel4);
            
            // Headlights
            const headlightGeometry = new THREE.SphereGeometry(0.2, 8, 8);
            const headlightMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xFFFFFF,
                emissive: 0xFFFFFF,
                emissiveIntensity: 0.5
            });
            
            // Left headlight
            const headlight1 = new THREE.Mesh(headlightGeometry, headlightMaterial);
            headlight1.position.set(-0.6, 0.5, 2);
            headlight1.scale.z = 0.5;
            car.add(headlight1);
            
            // Right headlight
            const headlight2 = new THREE.Mesh(headlightGeometry, headlightMaterial);
            headlight2.position.set(0.6, 0.5, 2);
            headlight2.scale.z = 0.5;
            car.add(headlight2);
            
            // Taillights
            const taillightGeometry = new THREE.SphereGeometry(0.15, 8, 8);
            const taillightMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xFF0000,
                emissive: 0xFF0000,
                emissiveIntensity: 0.5
            });
            
            // Left taillight
            const taillight1 = new THREE.Mesh(taillightGeometry, taillightMaterial);
            taillight1.position.set(-0.6, 0.5, -2);
            taillight1.scale.z = 0.5;
            car.add(taillight1);
            
            // Right taillight
            const taillight2 = new THREE.Mesh(taillightGeometry, taillightMaterial);
            taillight2.position.set(0.6, 0.5, -2);
            taillight2.scale.z = 0.5;
            car.add(taillight2);
            
            return car;
        }
        
        // Create pedestrians
        const pedestrians = [];
        function createPedestrians() {
            const pedestrianCount = 20;
            
            for (let i = 0; i < pedestrianCount; i++) {
                // Choose either sidewalk or crossing
                const onCrossing = Math.random() < 0.2;
                let x, z, direction;
                
                if (onCrossing) {
                    // Position on a crossing
                    const roadIndex = Math.floor(Math.random() * (citySize * 2 / (blockSize + roadWidth)));
                    const roadPos = -citySize + roadIndex * (blockSize + roadWidth);
                    
                    if (Math.random() > 0.5) {
                        // Horizontal crossing
                        x = -citySize + Math.random() * citySize * 2;
                        z = roadPos;
                        direction = Math.random() > 0.5 ? 0 : Math.PI;
                    } else {
                        // Vertical crossing
                        x = roadPos;
                        z = -citySize + Math.random() * citySize * 2;
                        direction = Math.random() > 0.5 ? Math.PI / 2 : -Math.PI / 2;
                    }
                } else {
                    // Position on sidewalk
                    if (Math.random() > 0.5) {
                        // Horizontal sidewalk
                        const roadIndex = Math.floor(Math.random() * (citySize * 2 / (blockSize + roadWidth)));
                        const roadPos = -citySize + roadIndex * (blockSize + roadWidth);
                        z = roadPos + (Math.random() > 0.5 ? roadWidth/2 + 1 : -roadWidth/2 - 1);
                        x = -citySize + Math.random() * citySize * 2;
                        direction = Math.random() > 0.5 ? 0 : Math.PI;
                    } else {
                        // Vertical sidewalk
                        const roadIndex = Math.floor(Math.random() * (citySize * 2 / (blockSize + roadWidth)));
                        const roadPos = -citySize + roadIndex * (blockSize + roadWidth);
                        x = roadPos + (Math.random() > 0.5 ? roadWidth/2 + 1 : -roadWidth/2 - 1);
                        z = -citySize + Math.random() * citySize * 2;
                        direction = Math.random() > 0.5 ? Math.PI / 2 : -Math.PI / 2;
                    }
                }
                
                // Create pedestrian
                const pedestrian = createPedestrian();
                pedestrian.position.set(x, 0, z);
                pedestrian.rotation.y = direction;
                
                pedestrians.push({
                    mesh: pedestrian,
                    speed: 0.02 + Math.random() * 0.03,
                    direction,
                    waitTime: 0
                });
                
                scene.add(pedestrian);
            }
        }
        
        // Create a pedestrian mesh
        function createPedestrian() {
            const pedestrian = new THREE.Group();
            
            // Random color for clothes
            const clothesColor = new THREE.Color(
                Math.random(),
                Math.random(),
                Math.random()
            );
            
            // Body
            const bodyGeometry = new THREE.CylinderGeometry(0.2, 0.2, 0.8, 8);
            const bodyMaterial = new THREE.MeshStandardMaterial({ color: clothesColor });
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.position.y = 0.9;
            body.castShadow = true;
            pedestrian.add(body);
            
            // Head
            const headGeometry = new THREE.SphereGeometry(0.15, 8, 8);
            const headMaterial = new THREE.MeshStandardMaterial({ color: 0xFFDBAC });
            const head = new THREE.Mesh(headGeometry, headMaterial);
            head.position.y = 1.45;
            head.castShadow = true;
            pedestrian.add(head);
            
            // Arms
            const armGeometry = new THREE.BoxGeometry(0.1, 0.5, 0.1);
            const armMaterial = new THREE.MeshStandardMaterial({ color: clothesColor });
            
            // Left arm
            const leftArm = new THREE.Mesh(armGeometry, armMaterial);
            leftArm.position.set(-0.3, 1.05, 0);
            leftArm.rotation.z = -Math.PI / 6;
            leftArm.castShadow = true;
            pedestrian.add(leftArm);
            
            // Right arm
            const rightArm = new THREE.Mesh(armGeometry, armMaterial);
            rightArm.position.set(0.3, 1.05, 0);
            rightArm.rotation.z = Math.PI / 6;
            rightArm.castShadow = true;
            pedestrian.add(rightArm);
            
            // Legs
            const legGeometry = new THREE.BoxGeometry(0.12, 0.5, 0.12);
            const legMaterial = new THREE.MeshStandardMaterial({ color: 0x003366 });
            
            // Left leg
            const leftLeg = new THREE.Mesh(legGeometry, legMaterial);
            leftLeg.position.set(-0.1, 0.25, 0);
            leftLeg.castShadow = true;
            pedestrian.add(leftLeg);
            
            // Right leg
            const rightLeg = new THREE.Mesh(legGeometry, legMaterial);
            rightLeg.position.set(0.1, 0.25, 0);
            rightLeg.castShadow = true;
            pedestrian.add(rightLeg);
            
            return pedestrian;
        }
        
        // Arrays for animated elements
        const trafficLights = [];
        const streetLights = [];
        
        // Initialize the scene
        function init() {
            createRoads();
            createBuildings();
            createTrafficLights();
            createCars();
            createPedestrians();
            
            // Set up camera controls
            setupCameraControls();
            
            // Start animation loop
            animate();
        }
        
        // Camera controls
        const keys = {};
        const moveSpeed = 0.5;
        const rotateSpeed = 0.02;
        
        function setupCameraControls() {
            // Mouse controls for rotation
            let isDragging = false;
            let previousMousePosition = { x: 0, y: 0 };
            
            document.addEventListener('mousedown', (e) => {
                isDragging = true;
            });
            
            document.addEventListener('mouseup', () => {
                isDragging = false;
            });
            
            document.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    const deltaMove = {
                        x: e.clientX - previousMousePosition.x,
                        y: e.clientY - previousMousePosition.y
                    };
                    
                    if (deltaMove.x !== 0) {
                        camera.rotation.y -= deltaMove.x * 0.01;
                    }
                    
                    if (deltaMove.y !== 0) {
                        const newRotationX = camera.rotation.x - deltaMove.y * 0.01;
                        // Limit vertical rotation to avoid flipping
                        camera.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, newRotationX));
                    }
                }
                
                previousMousePosition = {
                    x: e.clientX,
                    y: e.clientY
                };
            });
            
            // Keyboard controls for movement
            document.addEventListener('keydown', (e) => {
                keys[e.key.toLowerCase()] = true;
            });
            
            document.addEventListener('keyup', (e) => {
                keys[e.key.toLowerCase()] = false;
            });
            
            // Add touch controls for mobile
            document.addEventListener('touchstart', (e) => {
                isDragging = true;
                previousMousePosition = {
                    x: e.touches[0].clientX,
                    y: e.touches[0].clientY
                };
            });
            
            document.addEventListener('touchend', () => {
                isDragging = false;
            });
            
            document.addEventListener('touchmove', (e) => {
                if (isDragging) {
                    const deltaMove = {
                        x: e.touches[0].clientX - previousMousePosition.x,
                        y: e.touches[0].clientY - previousMousePosition.y
                    };
                    
                    if (deltaMove.x !== 0) {
                        camera.rotation.y -= deltaMove.x * 0.01;
                    }
                    
                    if (deltaMove.y !== 0) {
                        const newRotationX = camera.rotation.x - deltaMove.y * 0.01;
                        camera.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, newRotationX));
                    }
                    
                    previousMousePosition = {
                        x: e.touches[0].clientX,
                        y: e.touches[0].clientY
                    };
                }
            });
        }
        
        // Time system
        let timeOfDay = 0; // 0-24 hours
        const timeSpeed = 0.01; // Time passing speed
        
        // Update camera position based on keyboard input
        function updateCamera() {
            // Get direction vectors
            const direction = new THREE.Vector3();
            camera.getWorldDirection(direction);
            
            const sideDirection = new THREE.Vector3();
            sideDirection.crossVectors(direction, new THREE.Vector3(0, 1, 0));
            
            // WASD movement
            if (keys['w']) {
                camera.position.addScaledVector(direction, moveSpeed);
            }
            if (keys['s']) {
                camera.position.addScaledVector(direction, -moveSpeed);
            }
            if (keys['a']) {
                camera.position.addScaledVector(sideDirection, moveSpeed);
            }
            if (keys['d']) {
                camera.position.addScaledVector(sideDirection, -moveSpeed);
            }
            
            // Q/E for time control
            if (keys['q']) {
                timeOfDay = (timeOfDay - timeSpeed * 5) % 24;
                if (timeOfDay < 0) timeOfDay += 24;
                updateDayNightCycle();
            }
            if (keys['e']) {
                timeOfDay = (timeOfDay + timeSpeed * 5) % 24;
                updateDayNightCycle();
            }
        }
        
        // Update day/night cycle lighting
        function updateDayNightCycle() {
            // Update time of day
            timeOfDay = (timeOfDay + timeSpeed) % 24;
            
            // Update sun position and intensity
            const sunAngle = (timeOfDay / 24) * Math.PI * 2 - Math.PI / 2;
            const sunHeight = Math.sin(sunAngle);
            const sunDistance = 200;
            
            sunLight.position.set(
                Math.cos(sunAngle) * sunDistance,
                sunHeight * sunDistance,
                Math.sin(sunAngle) * sunDistance
            );
            
            // Day/night lighting
            if (sunHeight > 0) {
                // Daytime
                const intensity = Math.min(1, sunHeight * 2);
                sunLight.intensity = intensity;
                ambientLight.intensity = 0.2 + 0.2 * intensity;
                scene.background = new THREE.Color(
                    0.5 + 0.3 * intensity,
                    0.7 + 0.3 * intensity,
                    0.9 + 0.1 * intensity
                );
                
                // Turn off street lights during day
                streetLights.forEach(item => {
                    item.light.intensity = 0;
                    item.lamp.material.emissiveIntensity = 0.1;
                });
            } else {
                // Nighttime
                const darkness = Math.abs(sunHeight);
                sunLight.intensity = 0.1;
                ambientLight.intensity = Math.max(0.1, 0.2 - darkness * 0.1);
                scene.background = new THREE.Color(
                    0.05,
                    0.05,
                    0.1
                );
                
                // Turn on street lights at night
                streetLights.forEach(item => {
                    item.light.intensity = 1;
                    item.lamp.material.emissiveIntensity = 0.8;
                });
            }
        }
        
        // Update traffic lights
        function updateTrafficLights(deltaTime) {
            trafficLights.forEach(light => {
                light.timer -= deltaTime;
                
                if (light.timer <= 0) {
                    // Cycle through states (red, yellow, green)
                    light.state = (light.state + 1) % 3;
                    light.timer = light.state === 1 ? 2 : 5; // Yellow is shorter
                    
                    // Update light visuals
                    for (let i = 0; i < 3; i++) {
                        const lightMesh = light.box.children[i];
                        lightMesh.material.emissive = new THREE.Color(
                            i === light.state ? 0.5 : 0
                        );
                    }
                }
            });
        }
        
        // Move cars
        function moveCars() {
            cars.forEach(car => {
                if (car.onHorizontalRoad) {
                    // Move along x-axis
                    car.mesh.position.x += car.speed * car.direction;
                    
                    // Reset position when out of bounds
                    if (car.mesh.position.x > citySize + 5) {
                        car.mesh.position.x = -citySize - 5;
                    } else if (car.mesh.position.x < -citySize - 5) {
                        car.mesh.position.x = citySize + 5;
                    }
                } else {
                    // Move along z-axis
                    car.mesh.position.z += car.speed * car.direction;
                    
                    // Reset position when out of bounds
                    if (car.mesh.position.z > citySize + 5) {
                        car.mesh.position.z = -citySize - 5;
                    } else if (car.mesh.position.z < -citySize - 5) {
                        car.mesh.position.z = citySize + 5;
                    }
                }
            });
        }
        
        // Move pedestrians
        function movePedestrians() {
            pedestrians.forEach(pedestrian => {
                // Check if waiting at crossing
                if (pedestrian.waitTime > 0) {
                    pedestrian.waitTime -= 0.1;
                    return;
                }
                
                // Move based on direction
                const moveX = Math.cos(pedestrian.direction) * pedestrian.speed;
                const moveZ = Math.sin(pedestrian.direction) * pedestrian.speed;
                
                pedestrian.mesh.position.x += moveX;
                pedestrian.mesh.position.z += moveZ;
                
                // Reset position when out of bounds
                if (pedestrian.mesh.position.x > citySize + 5) {
                    pedestrian.mesh.position.x = -citySize - 5;
                } else if (pedestrian.mesh.position.x < -citySize - 5) {
                    pedestrian.mesh.position.x = citySize + 5;
                }
                
                if (pedestrian.mesh.position.z > citySize + 5) {
                    pedestrian.mesh.position.z = -citySize - 5;
                } else if (pedestrian.mesh.position.z < -citySize - 5) {
                    pedestrian.mesh.position.z = citySize + 5;
                }
                
                // Random change of direction sometimes
                if (Math.random() < 0.005) {
                    pedestrian.direction = Math.random() * Math.PI * 2;
                    pedestrian.mesh.rotation.y = pedestrian.direction;
                }
                
                // Sometimes wait at crossings
                if (Math.random() < 0.001) {
                    pedestrian.waitTime = 10 + Math.random() * 30;
                }
            });
        }
        
        // Handle window resize
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        window.addEventListener('resize', onWindowResize, false);
        
        // Animation loop
        let lastTime = 0;
        function animate(time = 0) {
            requestAnimationFrame(animate);
            
            const deltaTime = (time - lastTime) / 1000; // Convert to seconds
            lastTime = time;
            
            // Update camera position based on controls
            updateCamera();
            
            // Update day/night cycle
            updateDayNightCycle();
            
            // Update traffic lights
            updateTrafficLights(deltaTime);
            
            // Move cars
            moveCars();
            
            // Move pedestrians
            movePedestrians();
            
            // Render scene
            renderer.render(scene, camera);
        }
        
        // Initialize the scene
        init();
    </script>
</body>
