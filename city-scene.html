<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D City Scene</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
        .controls {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 5px;
            color: white;
            font-family: Arial, sans-serif;
        }
        .time-controls {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 5px;
            color: white;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <div class="controls">
        <p>Controls: WASD to move, Mouse to look around</p>
    </div>
    <div class="time-controls">
        <button id="toggleTime">Toggle Day/Night</button>
        <span id="timeDisplay">Day</span>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Main Three.js variables
        let scene, camera, renderer;
        let buildings = [];
        let cars = [];
        let pedestrians = [];
        let trafficLights = [];
        let dayTime = true;
        let clock = new THREE.Clock();
        
        // Camera movement variables
        let moveForward = false;
        let moveBackward = false;
        let moveLeft = false;
        let moveRight = false;
        let cameraSpeed = 0.5;
        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();
        
        // City dimensions
        const CITY_SIZE = 500;
        const BLOCK_SIZE = 50;
        const STREET_WIDTH = 20;
        const SIDEWALK_WIDTH = 10;
        
        // Initialize the scene
        function init() {
            // Create scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); // Sky blue background
            
            // Create camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 10, 50);
            
            // Create renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);
            
            // Add fog for atmosphere
            scene.fog = new THREE.FogExp2(0xcccccc, 0.002);
            
            // Create lights
            createLights();
            
            // Create the ground
            createGround();
            
            // Create buildings, roads, and other elements
            createCity();
            
            // Create moving objects (cars and pedestrians)
            createCars();
            createPedestrians();
            
            // Handle window resize
            window.addEventListener('resize', onWindowResize, false);
            
            // Setup camera controls
            setupCameraControls();
            
            // Set up time toggle
            document.getElementById('toggleTime').addEventListener('click', toggleDayNight);
            
            // Start animation loop
            animate();
        }
        
        function createLights() {
            // Ambient light for overall illumination
            const ambientLight = new THREE.AmbientLight(0x404040);
            scene.add(ambientLight);
            
            // Directional light (sun/moon)
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(100, 200, 100);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            directionalLight.shadow.camera.near = 0.5;
            directionalLight.shadow.camera.far = 500;
            directionalLight.shadow.camera.left = -200;
            directionalLight.shadow.camera.right = 200;
            directionalLight.shadow.camera.top = 200;
            directionalLight.shadow.camera.bottom = -200;
            scene.add(directionalLight);
            
            // Store the main directional light for day/night cycle
            scene.userData.mainLight = directionalLight;
        }
        
        function createGround() {
            // Create ground as a large plane
            const groundGeometry = new THREE.PlaneGeometry(CITY_SIZE * 2, CITY_SIZE * 2);
            const groundMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x1a3300,  // Dark green for grass
                roughness: 0.8,
                metalness: 0.2
            });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2; // Rotate to be horizontal
            ground.position.y = -0.5;
            ground.receiveShadow = true;
            scene.add(ground);
        }
        
        function createCity() {
            // Create grid of city blocks
            const numBlocks = Math.floor(CITY_SIZE / (BLOCK_SIZE + STREET_WIDTH));
            const startPos = -CITY_SIZE / 2 + BLOCK_SIZE / 2;
            
            for (let x = 0; x < numBlocks; x++) {
                for (let z = 0; z < numBlocks; z++) {
                    const posX = startPos + x * (BLOCK_SIZE + STREET_WIDTH);
                    const posZ = startPos + z * (BLOCK_SIZE + STREET_WIDTH);
                    
                    // Create a city block
                    createCityBlock(posX, posZ);
                    
                    // Create roads
                    createRoads(posX, posZ);
                    
                    // Create intersections
                    if (x < numBlocks - 1 && z < numBlocks - 1) {
                        createIntersection(
                            posX + BLOCK_SIZE/2 + STREET_WIDTH/2, 
                            posZ + BLOCK_SIZE/2 + STREET_WIDTH/2
                        );
                    }
                }
            }
            
            // Create street props (lamps, benches, trees)
            createStreetProps();
        }
        
        function createCityBlock(x, z) {
            // Determine if this block is commercial (tall buildings) or residential
            const isCommercial = Math.random() < 0.3;
            
            if (isCommercial) {
                // Commercial district with skyscrapers
                const numBuildings = Math.floor(Math.random() * 4) + 1;
                for (let i = 0; i < numBuildings; i++) {
                    createSkyscraper(
                        x + (Math.random() - 0.5) * (BLOCK_SIZE - 15),
                        z + (Math.random() - 0.5) * (BLOCK_SIZE - 15)
                    );
                }
            } else {
                // Residential or mixed-use area
                createMixedBuildings(x, z);
            }
            
            // Create sidewalks around the block
            createSidewalks(x, z);
        }
        
        function createSkyscraper(x, z) {
            const height = Math.random() * 80 + 40; // 40-120 units tall
            const width = Math.random() * 10 + 15;
            const depth = Math.random() * 10 + 15;
            
            // Main building
            const buildingGeometry = new THREE.BoxGeometry(width, height, depth);
            const buildingMaterial = new THREE.MeshPhongMaterial({
                color: new THREE.Color(
                    0.4 + Math.random() * 0.2,
                    0.4 + Math.random() * 0.2,
                    0.4 + Math.random() * 0.2
                )
            });
            
            const building = new THREE.Mesh(buildingGeometry, buildingMaterial);
            building.position.set(x, height/2, z);
            building.castShadow = true;
            building.receiveShadow = true;
            scene.add(building);
            buildings.push(building);
            
            // Add windows
            addBuildingWindows(building, width, height, depth);
            
            // Some buildings get additional features
            if (Math.random() < 0.5) {
                // Add a smaller section on top (like a penthouse or mechanical floor)
                const topWidth = width * 0.7;
                const topDepth = depth * 0.7;
                const topHeight = Math.random() * 10 + 5;
                
                const topGeometry = new THREE.BoxGeometry(topWidth, topHeight, topDepth);
                const topMaterial = new THREE.MeshPhongMaterial({
                    color: new THREE.Color(
                        0.3 + Math.random() * 0.3,
                        0.3 + Math.random() * 0.3,
                        0.3 + Math.random() * 0.3
                    )
                });
                
                const top = new THREE.Mesh(topGeometry, topMaterial);
                top.position.set(x, height + topHeight/2, z);
                top.castShadow = true;
                scene.add(top);
            }
        }
        
        function addBuildingWindows(building, width, height, depth) {
            // Window parameters
            const windowSize = 1.5;
            const windowSpacing = 3;
            const windowDepth = 0.1;
            const windowGeometry = new THREE.BoxGeometry(windowSize, windowSize, windowDepth);
            const windowMaterial = new THREE.MeshPhongMaterial({
                color: 0x88ccff,
                transparent: true,
                opacity: 0.7,
                emissive: 0x114477,
                emissiveIntensity: 0.5
            });
            
            // Calculate number of windows in each dimension
            const numWindowsWidth = Math.floor((width - 2) / windowSpacing);
            const numWindowsHeight = Math.floor((height - 2) / windowSpacing);
            const numWindowsDepth = Math.floor((depth - 2) / windowSpacing);
            
            // Helper function to place windows on a face
            const placeWindowsOnFace = (dim1, dim2, fixedDim, fixedValue, isVertical) => {
                const dim1Start = -dim1/2 + windowSpacing;
                const dim1End = dim1/2 - windowSpacing;
                const dim1Step = (dim1End - dim1Start) / (isVertical ? numWindowsHeight - 1 : numWindowsWidth - 1);
                
                const dim2Start = -dim2/2 + windowSpacing;
                const dim2End = dim2/2 - windowSpacing;
                const dim2Step = (dim2End - dim2Start) / (isVertical ? numWindowsDepth - 1 : numWindowsHeight - 1);
                
                for (let i = 0; i < (isVertical ? numWindowsHeight : numWindowsWidth); i++) {
                    for (let j = 0; j < (isVertical ? numWindowsDepth : numWindowsHeight); j++) {
                        // Random chance to skip a window (for variation)
                        if (Math.random() < 0.1) continue;
                        
                        const window = new THREE.Mesh(windowGeometry, windowMaterial.clone());
                        
                        // Position window
                        const pos = {};
                        pos[isVertical ? 'y' : 'x'] = dim1Start + i * dim1Step;
                        pos[isVertical ? 'z' : 'y'] = dim2Start + j * dim2Step;
                        pos[fixedDim] = fixedValue;
                        
                        window.position.set(
                            building.position.x + pos.x,
                            building.position.y + pos.y - height/2,
                            building.position.z + pos.z
                        );
                        
                        // Random light intensity for some windows
                        window.material.emissiveIntensity = Math.random() * 0.5 + 0.2;
                        
                        scene.add(window);
                    }
                }
            };
            
            // Place windows on all four sides
            placeWindowsOnFace(width, height, 'z', depth/2 + windowDepth/2, false);
            placeWindowsOnFace(width, height, 'z', -depth/2 - windowDepth/2, false);
            placeWindowsOnFace(height, depth, 'x', width/2 + windowDepth/2, true);
            placeWindowsOnFace(height, depth, 'x', -width/2 - windowDepth/2, true);
        }
        
        function createMixedBuildings(blockX, blockZ) {
            // Create a mix of smaller buildings for residential/commercial areas
            const numBuildings = Math.floor(Math.random() * 6) + 4; // 4-10 buildings per block
            
            for (let i = 0; i < numBuildings; i++) {
                const x = blockX + (Math.random() - 0.5) * (BLOCK_SIZE - 10);
                const z = blockZ + (Math.random() - 0.5) * (BLOCK_SIZE - 10);
                
                // Randomly choose building type
                const buildingType = Math.random();
                
                if (buildingType < 0.6) {
                    // Apartment building
                    createApartmentBuilding(x, z);
                } else {
                    // Small shop or house
                    createShop(x, z);
                }
            }
        }
        
        function createApartmentBuilding(x, z) {
            const height = Math.random() * 15 + 10; // 10-25 units tall
            const width = Math.random() * 5 + 10;
            const depth = Math.random() * 5 + 10;
            
            // Main building
            const buildingGeometry = new THREE.BoxGeometry(width, height, depth);
            const buildingMaterial = new THREE.MeshPhongMaterial({
                color: new THREE.Color(
                    0.6 + Math.random() * 0.3,
                    0.6 + Math.random() * 0.3,
                    0.5 + Math.random() * 0.2
                )
            });
            
            const building = new THREE.Mesh(buildingGeometry, buildingMaterial);
            building.position.set(x, height/2, z);
            building.castShadow = true;
            building.receiveShadow = true;
            scene.add(building);
            buildings.push(building);
            
            // Add windows
            addBuildingWindows(building, width, height, depth);
        }
        
        function createShop(x, z) {
            const height = Math.random() * 3 + 4; // 4-7 units tall
            const width = Math.random() * 4 + 6;
            const depth = Math.random() * 4 + 6;
            
            // Main building
            const buildingGeometry = new THREE.BoxGeometry(width, height, depth);
            const buildingMaterial = new THREE.MeshPhongMaterial({
                color: new THREE.Color(
                    0.7 + Math.random() * 0.3,
                    0.6 + Math.random() * 0.3,
                    0.5 + Math.random() * 0.2
                )
            });
            
            const building = new THREE.Mesh(buildingGeometry, buildingMaterial);
            building.position.set(x, height/2, z);
            building.castShadow = true;
            building.receiveShadow = true;
            scene.add(building);
            buildings.push(building);
            
            // Add storefront (larger windows)
            const storeFrontGeometry = new THREE.PlaneGeometry(width * 0.8, height * 0.6);
            const storeFrontMaterial = new THREE.MeshPhongMaterial({
                color: 0x88ccff,
                transparent: true,
                opacity: 0.7,
                emissive: 0x114477,
                emissiveIntensity: 0.7
            });
            
            // Create storefronts on different sides
            const sides = [
                { dim: 'z', value: depth/2 + 0.01, rotation: [0, 0, 0] },
                { dim: 'z', value: -depth/2 - 0.01, rotation: [0, Math.PI, 0] },
                { dim: 'x', value: width/2 + 0.01, rotation: [0, Math.PI/2, 0] },
                { dim: 'x', value: -width/2 - 0.01, rotation: [0, -Math.PI/2, 0] }
            ];
            
            // Choose random sides for storefronts (1-2 sides)
            const numSides = Math.floor(Math.random() * 2) + 1;
            const sideIndices = [];
            while (sideIndices.length < numSides) {
                const idx = Math.floor(Math.random() * 4);
                if (!sideIndices.includes(idx)) {
                    sideIndices.push(idx);
                }
            }
            
            for (const idx of sideIndices) {
                const side = sides[idx];
                const storeFront = new THREE.Mesh(storeFrontGeometry, storeFrontMaterial);
                
                // Position the storefront
                const pos = { x: 0, y: -height * 0.1, z: 0 };
                pos[side.dim] = side.value;
                
                storeFront.position.set(
                    building.position.x + pos.x,
                    building.position.y + pos.y,
                    building.position.z + pos.z
                );
                
                storeFront.rotation.set(...side.rotation);
                scene.add(storeFront);
            }
        }
        
        function createRoads(x, z) {
            // Horizontal road
            const roadGeometryH = new THREE.PlaneGeometry(STREET_WIDTH, BLOCK_SIZE + STREET_WIDTH);
            const roadMaterial = new THREE.MeshPhongMaterial({ 
                color: 0x333333,
                roughness: 0.9,
                metalness: 0.1
            });
            
            const horizontalRoad = new THREE.Mesh(roadGeometryH, roadMaterial);
            horizontalRoad.rotation.x = -Math.PI / 2;
            horizontalRoad.position.set(
                x + BLOCK_SIZE/2 + STREET_WIDTH/2, 
                0, 
                z
            );
            horizontalRoad.receiveShadow = true;
            scene.add(horizontalRoad);
            
            // Vertical road
            const roadGeometryV = new THREE.PlaneGeometry(BLOCK_SIZE + STREET_WIDTH, STREET_WIDTH);
            
            const verticalRoad = new THREE.Mesh(roadGeometryV, roadMaterial);
            verticalRoad.rotation.x = -Math.PI / 2;
            verticalRoad.position.set(
                x, 
                0, 
                z + BLOCK_SIZE/2 + STREET_WIDTH/2
            );
            verticalRoad.receiveShadow = true;
            scene.add(verticalRoad);
            
            // Road markings
            addRoadMarkings(x, z);
        }
        
        function addRoadMarkings(x, z) {
            // Road marking material (white lines)
            const markingMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
            
            // Center lines for horizontal road
            const centerLineGeometryH = new THREE.PlaneGeometry(BLOCK_SIZE, 0.5);
            const centerLineH = new THREE.Mesh(centerLineGeometryH, markingMaterial);
            centerLineH.rotation.x = -Math.PI / 2;
            centerLineH.position.set(
                x + BLOCK_SIZE/2 + STREET_WIDTH/2,
                0.01, // Slightly above road
                z
            );
            scene.add(centerLineH);
            
            // Center lines for vertical road
            const centerLineGeometryV = new THREE.PlaneGeometry(0.5, BLOCK_SIZE);
            const centerLineV = new THREE.Mesh(centerLineGeometryV, markingMaterial);
            centerLineV.rotation.x = -Math.PI / 2;
            centerLineV.position.set(
                x,
                0.01,
                z + BLOCK_SIZE/2 + STREET_WIDTH/2
            );
            scene.add(centerLineV);
            
            // Add pedestrian crossings
            addPedestrianCrossing(
                x + BLOCK_SIZE/2 + STREET_WIDTH/2,
                z + BLOCK_SIZE/2,
                true
            );
            
            addPedestrianCrossing(
                x + BLOCK_SIZE/2,
                z + BLOCK_SIZE/2 + STREET_WIDTH/2,
                false
            );
        }
        
        function addPedestrianCrossing(x, z, isHorizontal) {
            const stripeWidth = 1;
            const stripeLength = STREET_WIDTH - 4;
            const numStripes = 6;
            const spacing = 2;
            
            for (let i = 0; i < numStripes; i++) {
                const stripeGeometry = new THREE.PlaneGeometry(
                    isHorizontal ? stripeWidth : stripeLength,
                    isHorizontal ? stripeLength : stripeWidth
                );
                
                const stripe = new THREE.Mesh(
                    stripeGeometry,
                    new THREE.MeshBasicMaterial({ color: 0xffffff })
                );
                
                stripe.rotation.x = -Math.PI / 2;
                
                const offset = (i - (numStripes-1)/2) * (stripeWidth + spacing);
                
                stripe.position.set(
                    x + (isHorizontal ? offset : 0),
                    0.02, // Slightly above road
                    z + (isHorizontal ? 0 : offset)
                );
                
                scene.add(stripe);
            }
        }
        
        function createIntersection(x, z) {
            // Traffic lights
            createTrafficLight(x - STREET_WIDTH/2 + 2, z - STREET_WIDTH/2 + 2, Math.PI/4);
            createTrafficLight(x + STREET_WIDTH/2 - 2, z - STREET_WIDTH/2 + 2, Math.PI*3/4);
            createTrafficLight(x - STREET_WIDTH/2 + 2, z + STREET_WIDTH/2 - 2, -Math.PI/4);
            createTrafficLight(x + STREET_WIDTH/2 - 2, z + STREET_WIDTH/2 - 2, -Math.PI*3/4);
        }
        
        function createTrafficLight(x, z, rotation) {
            // Pole
            const poleGeometry = new THREE.CylinderGeometry(0.3, 0.3, 8, 8);
            const poleMaterial = new THREE.MeshPhongMaterial({ color: 0x333333 });
            const pole = new THREE.Mesh(poleGeometry, poleMaterial);
            pole.position.set(x, 4, z);
            pole.castShadow = true;
            scene.add(pole);
            
            // Light housing
            const housingGeometry = new THREE.BoxGeometry(1, 3, 1);
            const housingMaterial = new THREE.MeshPhongMaterial({ color: 0x111111 });
            const housing = new THREE.Mesh(housingGeometry, housingMaterial);
            housing.position.set(x, 8, z);
            housing.castShadow = true;
            scene.add(housing);
            
            // Create traffic light object for animation
            const trafficLight = {
                red: createLightBulb(x, 9, z, 0xff0000),
                yellow: createLightBulb(x, 8, z, 0xffff00),
                green: createLightBulb(x, 7, z, 0x00ff00),
                state: Math.floor(Math.random() * 3), // 0: red, 1: yellow, 2: green
                timer: Math.random() * 10 // Random initial timer
            };
            
            // Add to traffic lights array for animation
            trafficLights.push(trafficLight);
            
            // Rotate the whole traffic light
            pole.rotation.y = rotation;
            housing.rotation.y = rotation;
            trafficLight.red.rotation.y = rotation;
            trafficLight.yellow.rotation.y = rotation;
            trafficLight.green.rotation.y = rotation;
            
            return trafficLight;
        }
        
        function createLightBulb(x, y, z, color) {
            const bulbGeometry = new THREE.SphereGeometry(0.4, 16, 16);
            const bulbMaterial = new THREE.MeshBasicMaterial({ 
                color: color,
                opacity: 0.2,
                transparent: true
            });
            
            const bulb = new THREE.Mesh(bulbGeometry, bulbMaterial);
            bulb.position.set(x, y, z);
            scene.add(bulb);
            
            return bulb;
        }
        
        function createSidewalks(x, z) {
            // Create sidewalks surrounding the block
            const sidewalkMaterial = new THREE.MeshPhongMaterial({ 
                color: 0xaaaaaa,
                roughness: 0.8
            });
            
            // Sidewalk geometry (including curbs)
            const sizeX = BLOCK_SIZE;
            const sizeZ = BLOCK_SIZE;
            
            // Create the sidewalk as a raised platform
            const sidewalkGeometry = new THREE.BoxGeometry(
                sizeX + SIDEWALK_WIDTH * 2, 
                0.3, 
                sizeZ + SIDEWALK_WIDTH * 2
            );
            
            const sidewalk = new THREE.Mesh(sidewalkGeometry, sidewalkMaterial);
            sidewalk.position.set(x, 0.15, z);
            sidewalk.receiveShadow = true;
            scene.add(sidewalk);
            
            // Cut out the middle (where buildings go)
            const cutoutGeometry = new THREE.BoxGeometry(sizeX, 1, sizeZ);
            const cutoutMaterial = new THREE.MeshBasicMaterial({ 
                colorWrite: false,
                stencil: true
            });
            
            const cutout = new THREE.Mesh(cutoutGeometry, cutoutMaterial);
            cutout.position.set(x, 0.2, z);
            scene.add(cutout);
        }
        
        function createStreetProps() {
            // Create street props - lamps, benches, trees along the sidewalks
            const numBlocks = Math.floor(CITY_SIZE / (BLOCK_SIZE + STREET_WIDTH));
            const startPos = -CITY_SIZE / 2 + BLOCK_SIZE / 2;
            
            for (let x = 0; x < numBlocks; x++) {
                for (let z = 0; z < numBlocks; z++) {
                    const blockX = startPos + x * (BLOCK_SIZE + STREET_WIDTH);
                    const blockZ = startPos + z * (BLOCK_SIZE + STREET_WIDTH);
                    
                    // Place props around this block
                    placePropsAroundBlock(blockX, blockZ);
                }
            }
        }
        
        function placePropsAroundBlock(blockX, blockZ) {
            const halfBlock = BLOCK_SIZE / 2;
            const outsideEdge = halfBlock + SIDEWALK_WIDTH * 0.6;
            
            // Place lamp posts at corners
            createLampPost(blockX - outsideEdge, blockZ - outsideEdge);
            createLampPost(blockX + outsideEdge, blockZ - outsideEdge);
            createLampPost(blockX - outsideEdge, blockZ + outsideEdge);
            createLampPost(blockX + outsideEdge, blockZ + outsideEdge);
            
            // Place props along the edges
            const numProps = Math.floor(BLOCK_SIZE / 10);
            
            for (let i = 1; i < numProps; i++) {
                const offset = (i / numProps) * BLOCK_SIZE - halfBlock;
                
                // Skip if too close to corners
                if (Math.abs(offset) > halfBlock - 5) continue;
                
                // Choose random prop type
                const propType = Math.random();
                
                // North edge
                if (propType < 0.4) {
                    createTree(blockX + offset, blockZ - outsideEdge);
                } else if (propType < 0.7) {
                    createBench(blockX + offset, blockZ - outsideEdge, 0);
                }
                
                // South edge
                if (Math.random() < 0.4) {
                    createTree(blockX + offset, blockZ + outsideEdge);
                } else if (Math.random() < 0.7) {
                    createBench(blockX + offset, blockZ + outsideEdge, Math.PI);
                }
                
                // West edge
                if (Math.random() < 0.4) {
                    createTree(blockX - outsideEdge, blockZ + offset);
                } else if (Math.random() < 0.7) {
                    createBench(blockX - outsideEdge, blockZ + offset, Math.PI/2);
                }
                
                // East edge
                if (Math.random() < 0.4) {
                    createTree(blockX + outsideEdge, blockZ + offset);
                } else if (Math.random() < 0.7) {
                    createBench(blockX + outsideEdge, blockZ + offset, -Math.PI/2);
                }
            }
        }
        
        function createLampPost(x, z) {
            // Pole
            const poleGeometry = new THREE.CylinderGeometry(0.2, 0.3, 7, 8);
            const poleMaterial = new THREE.MeshPhongMaterial({ color: 0x222222 });
            const pole = new THREE.Mesh(poleGeometry, poleMaterial);
            pole.position.set(x, 3.5, z);
    pole.castShadow = true;
    scene.add(pole);

    // Lamp head
    const lampHeadGeometry = new THREE.CylinderGeometry(0.5, 0.7, 0.6, 8);
    const lampHeadMaterial = new THREE.MeshPhongMaterial({ color: 0x333333 });
    const lampHead = new THREE.Mesh(lampHeadGeometry, lampHeadMaterial);
    lampHead.position.set(x, 7, z);
    lampHead.castShadow = true;
    scene.add(lampHead);

    // Light
    const lightGeometry = new THREE.SphereGeometry(0.3, 8, 8);
    const lightMaterial = new THREE.MeshBasicMaterial({ 
        color: 0xffffcc,
        transparent: true,
        opacity: 0.9
    });
    const light = new THREE.Mesh(lightGeometry, lightMaterial);
    light.position.set(x, 6.7, z);
    scene.add(light);

    // Point light
    const pointLight = new THREE.PointLight(0xffffcc, 0.6, 25);
    pointLight.position.set(x, 6.7, z);
    scene.add(pointLight);

    // Store reference for day/night toggling
    light.userData = { pointLight };

    return light;
    }

    function createTree(x, z) {
    // Tree trunk
    const trunkGeometry = new THREE.CylinderGeometry(0.4, 0.6, 2, 8);
    const trunkMaterial = new THREE.MeshPhongMaterial({ 
        color: 0x8B4513,
        roughness: 0.9
    });

    const trunk = new THREE.Mesh(trunkGeometry, trunkMaterial);
    trunk.position.set(x, 1, z);
    trunk.castShadow = true;
    trunk.receiveShadow = true;
    scene.add(trunk);

    // Tree foliage (using different shapes for variety)
    const foliageType = Math.floor(Math.random() * 3);
    let foliageGeometry;

    if (foliageType === 0) {
        // Cone-shaped tree
        foliageGeometry = new THREE.ConeGeometry(2, 4, 8);
    } else if (foliageType === 1) {
        // Sphere-shaped tree
        foliageGeometry = new THREE.SphereGeometry(2, 8, 8);
    } else {
        // Multi-layered tree
        const group = new THREE.Group();
        
        const layer1 = new THREE.Mesh(
            new THREE.ConeGeometry(2.5, 2, 8),
            new THREE.MeshPhongMaterial({ 
                color: 0x228B22, 
                roughness: 0.8 
            })
        );
        layer1.position.y = 2;
        layer1.castShadow = true;
        group.add(layer1);
        
        const layer2 = new THREE.Mesh(
            new THREE.ConeGeometry(2, 2, 8),
            new THREE.MeshPhongMaterial({ 
                color: 0x228B22, 
                roughness: 0.8 
            })
        );
        layer2.position.y = 3.5;
        layer2.castShadow = true;
        group.add(layer2);
        
        const layer3 = new THREE.Mesh(
            new THREE.ConeGeometry(1.5, 2, 8),
            new THREE.MeshPhongMaterial({ 
                color: 0x228B22, 
                roughness: 0.8 
            })
        );
        layer3.position.y = 5;
        layer3.castShadow = true;
        group.add(layer3);
        
        group.position.set(x, 1, z);
        scene.add(group);
        
        return; // Skip the rest for this type of tree
    }

    const foliageMaterial = new THREE.MeshPhongMaterial({ 
        color: 0x228B22,
        roughness: 0.8
    });

    const foliage = new THREE.Mesh(foliageGeometry, foliageMaterial);
    foliage.position.set(x, 4, z);
    foliage.castShadow = true;
    foliage.receiveShadow = true;
    scene.add(foliage);
    }

    function createBench(x, z, rotation) {
    // Bench seat
    const seatGeometry = new THREE.BoxGeometry(3, 0.2, 1);
    const woodMaterial = new THREE.MeshPhongMaterial({ 
        color: 0x8B4513,
        roughness: 0.8
    });

    const seat = new THREE.Mesh(seatGeometry, woodMaterial);
    seat.position.set(x, 0.7, z);
    seat.rotation.y = rotation;
    seat.castShadow = true;
    seat.receiveShadow = true;
    scene.add(seat);

    // Bench legs
    const legGeometry = new THREE.BoxGeometry(0.2, 0.6, 1);
    const metalMaterial = new THREE.MeshPhongMaterial({ 
        color: 0x333333,
        metalness: 0.8,
        roughness: 0.2
    });

    // Left leg
    const leftLeg = new THREE.Mesh(legGeometry, metalMaterial);
    leftLeg.position.set(x - 1.3, 0.3, z);
    leftLeg.rotation.y = rotation;
    leftLeg.castShadow = true;
    leftLeg.receiveShadow = true;
    scene.add(leftLeg);

    // Right leg
    const rightLeg = new THREE.Mesh(legGeometry, metalMaterial);
    rightLeg.position.set(x + 1.3, 0.3, z);
    rightLeg.rotation.y = rotation;
    rightLeg.castShadow = true;
    rightLeg.receiveShadow = true;
    scene.add(rightLeg);

    // Bench back
    const backGeometry = new THREE.BoxGeometry(3, 1, 0.2);
    const back = new THREE.Mesh(backGeometry, woodMaterial);
    back.position.set(
        x, 
        1.3, 
        z - 0.4 * Math.cos(rotation)
    );
    back.rotation.y = rotation;
    back.castShadow = true;
    back.receiveShadow = true;
    scene.add(back);
    }

    function createCars() {
    // Create cars on the roads
    const numCars = 40; // Number of cars in the scene

    for (let i = 0; i < numCars; i++) {
        // Determine if car is on horizontal or vertical road
        const isHorizontal = Math.random() < 0.5;
        
        // Get road position
        const numBlocks = Math.floor(CITY_SIZE / (BLOCK_SIZE + STREET_WIDTH));
        const startPos = -CITY_SIZE / 2 + BLOCK_SIZE / 2;
        
        // Choose random block
        const blockX = Math.floor(Math.random() * numBlocks);
        const blockZ = Math.floor(Math.random() * numBlocks);
        
        const x = startPos + blockX * (BLOCK_SIZE + STREET_WIDTH);
        const z = startPos + blockZ * (BLOCK_SIZE + STREET_WIDTH);
        
        // Position car on the road
        let carX, carZ, direction;
        
        if (isHorizontal) {
            carX = x + BLOCK_SIZE/2 + STREET_WIDTH/2;
            carZ = z + (Math.random() - 0.5) * BLOCK_SIZE;
            direction = Math.random() < 0.5 ? 0 : Math.PI;
        } else {
            carX = x + (Math.random() - 0.5) * BLOCK_SIZE;
            carZ = z + BLOCK_SIZE/2 + STREET_WIDTH/2;
            direction = Math.random() < 0.5 ? Math.PI/2 : -Math.PI/2;
        }
        
        // Create the car and add to array
        createCar(carX, carZ, direction);
    }
    }

    function createCar(x, z, direction) {
    // Choose random car color
    const carColors = [0xff0000, 0x0000ff, 0x00ff00, 0xffff00, 0x00ffff, 0xff00ff, 0xffffff, 0x000000];
    const carColor = carColors[Math.floor(Math.random() * carColors.length)];

    // Create car body
    const bodyGeometry = new THREE.BoxGeometry(4, 1, 2);
    const bodyMaterial = new THREE.MeshPhongMaterial({ 
        color: carColor,
        metalness: 0.5,
        roughness: 0.2
    });

    const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
    body.position.set(x, 1, z);
    body.rotation.y = direction;
    body.castShadow = true;
    body.receiveShadow = true;
    scene.add(body);

    // Create car cabin
    const cabinGeometry = new THREE.BoxGeometry(2, 0.8, 1.8);
    const cabinMaterial = new THREE.MeshPhongMaterial({ 
        color: 0x333333,
        metalness: 0.2,
        roughness: 0.1
    });

    const cabin = new THREE.Mesh(cabinGeometry, cabinMaterial);
    cabin.position.set(x - 0.5, 1.9, z);
    cabin.rotation.y = direction;
    cabin.castShadow = true;
    scene.add(cabin);

    // Create car wheels
    const wheelGeometry = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16);
    const wheelMaterial = new THREE.MeshPhongMaterial({ color: 0x333333 });

    // Front left wheel
    const frontLeftWheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
    frontLeftWheel.position.set(x + 1.3, 0.4, z - 1);
    frontLeftWheel.rotation.z = Math.PI / 2;
    frontLeftWheel.rotation.y = direction;
    frontLeftWheel.castShadow = true;
    scene.add(frontLeftWheel);

    // Front right wheel
    const frontRightWheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
    frontRightWheel.position.set(x + 1.3, 0.4, z + 1);
    frontRightWheel.rotation.z = Math.PI / 2;
    frontRightWheel.rotation.y = direction;
    frontRightWheel.castShadow = true;
    scene.add(frontRightWheel);

    // Rear left wheel
    const rearLeftWheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
    rearLeftWheel.position.set(x - 1.3, 0.4, z - 1);
    rearLeftWheel.rotation.z = Math.PI / 2;
    rearLeftWheel.rotation.y = direction;
    rearLeftWheel.castShadow = true;
    scene.add(rearLeftWheel);

    // Rear right wheel
    const rearRightWheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
    rearRightWheel.position.set(x - 1.3, 0.4, z + 1);
    rearRightWheel.rotation.z = Math.PI / 2;
    rearRightWheel.rotation.y = direction;
    rearRightWheel.castShadow = true;
    scene.add(rearRightWheel);

    // Store the car with its direction and speed
    const speed = Math.random() * 0.1 + 0.05;

    cars.push({
        body, 
        cabin,
        wheels: [frontLeftWheel, frontRightWheel, rearLeftWheel, rearRightWheel],
        direction,
        speed,
        x, 
        z
    });
    }

    function createPedestrians() {
    // Create pedestrians on sidewalks
    const numPedestrians = 30; // Number of pedestrians in the scene

    for (let i = 0; i < numPedestrians; i++) {
        // Choose a random sidewalk position
        const numBlocks = Math.floor(CITY_SIZE / (BLOCK_SIZE + STREET_WIDTH));
        const startPos = -CITY_SIZE / 2 + BLOCK_SIZE / 2;
        
        // Choose random block
        const blockX = Math.floor(Math.random() * numBlocks);
        const blockZ = Math.floor(Math.random() * numBlocks);
        
        const x = startPos + blockX * (BLOCK_SIZE + STREET_WIDTH);
        const z = startPos + blockZ * (BLOCK_SIZE + STREET_WIDTH);
        
        // Position pedestrian on the sidewalk
        const halfBlock = BLOCK_SIZE / 2;
        const sidewalkPos = halfBlock + SIDEWALK_WIDTH * 0.5;
        
        // Choose a random side of the block
        const side = Math.floor(Math.random() * 4);
        let pedX, pedZ, direction;
        
        switch (side) {
            case 0: // North side
                pedX = x + (Math.random() - 0.5) * BLOCK_SIZE;
                pedZ = z - sidewalkPos;
                direction = Math.random() < 0.5 ? Math.PI/2 : -Math.PI/2;
                break;
            case 1: // East side
                pedX = x + sidewalkPos;
                pedZ = z + (Math.random() - 0.5) * BLOCK_SIZE;
                direction = Math.random() < 0.5 ? 0 : Math.PI;
                break;
            case 2: // South side
                pedX = x + (Math.random() - 0.5) * BLOCK_SIZE;
                pedZ = z + sidewalkPos;
                direction = Math.random() < 0.5 ? Math.PI/2 : -Math.PI/2;
                break;
            case 3: // West side
                pedX = x - sidewalkPos;
                pedZ = z + (Math.random() - 0.5) * BLOCK_SIZE;
                direction = Math.random() < 0.5 ? 0 : Math.PI;
                break;
        }
        
        // Create the pedestrian and add to array
        createPedestrian(pedX, pedZ, direction);
    }
    }

    function createPedestrian(x, z, direction) {
    // Choose random pedestrian color
    const shirtColors = [0xff0000, 0x0000ff, 0x00ff00, 0xffff00, 0x00ffff, 0xff00ff, 0xffffff];
    const pantsColors = [0x000080, 0x808080, 0x000000, 0x8B4513];

    const shirtColor = shirtColors[Math.floor(Math.random() * shirtColors.length)];
    const pantsColor = pantsColors[Math.floor(Math.random() * pantsColors.length)];

    // Create pedestrian group
    const pedestrianGroup = new THREE.Group();
    pedestrianGroup.position.set(x, 0, z);
    pedestrianGroup.rotation.y = direction;

    // Create head
    const headGeometry = new THREE.SphereGeometry(0.25, 16, 16);
    const headMaterial = new THREE.MeshPhongMaterial({ 
        color: 0xFFD700,
        roughness: 0.8
    });

    const head = new THREE.Mesh(headGeometry, headMaterial);
    head.position.y = 2.4;
    head.castShadow = true;
    pedestrianGroup.add(head);

    // Create body
    const bodyGeometry = new THREE.CylinderGeometry(0.25, 0.25, 0.8, 8);
    const bodyMaterial = new THREE.MeshPhongMaterial({ 
        color: shirtColor,
        roughness: 0.8
    });

    const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
    body.position.y = 1.9;
    body.castShadow = true;
    pedestrianGroup.add(body);

    // Create legs
    const legGeometry = new THREE.CylinderGeometry(0.1, 0.1, 0.8, 8);
    const legMaterial = new THREE.MeshPhongMaterial({ 
        color: pantsColor,
        roughness: 0.8
    });

    // Left leg
    const leftLeg = new THREE.Mesh(legGeometry, legMaterial);
    leftLeg.position.set(0.1, 1.3, 0);
    leftLeg.castShadow = true;
    pedestrianGroup.add(leftLeg);

    // Right leg
    const rightLeg = new THREE.Mesh(legGeometry, legMaterial);
    rightLeg.position.set(-0.1, 1.3, 0);
    rightLeg.castShadow = true;
    pedestrianGroup.add(rightLeg);

    // Create arms
    const armGeometry = new THREE.CylinderGeometry(0.08, 0.08, 0.6, 8);

    // Left arm
    const leftArm = new THREE.Mesh(armGeometry, bodyMaterial);
    leftArm.position.set(0.35, 1.9, 0);
    leftArm.rotation.z = Math.PI / 12;
    leftArm.castShadow = true;
    pedestrianGroup.add(leftArm);

    // Right arm
    const rightArm = new THREE.Mesh(armGeometry, bodyMaterial);
    rightArm.position.set(-0.35, 1.9, 0);
    rightArm.rotation.z = -Math.PI / 12;
    rightArm.castShadow = true;
    pedestrianGroup.add(rightArm);

    scene.add(pedestrianGroup);

    // Store the pedestrian with animation properties
    const walkingSpeed = Math.random() * 0.02 + 0.01;
    const armSwingRate = Math.random() * 0.05 + 0.03;

    pedestrians.push({
        group: pedestrianGroup,
        leftLeg,
        rightLeg,
        leftArm,
        rightArm,
        direction,
        walkingSpeed,
        armSwingRate,
        armSwingOffset: Math.random() * Math.PI * 2,
        legSwingOffset: Math.random() * Math.PI * 2
    });
    }

    function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function setupCameraControls() {
    document.addEventListener('keydown', function(event) {
        switch(event.code) {
            case 'KeyW':
                moveForward = true;
                break;
            case 'KeyA':
                moveLeft = true;
                break;
            case 'KeyS':
                moveBackward = true;
                break;
            case 'KeyD':
                moveRight = true;
                break;
        }
    });

    document.addEventListener('keyup', function(event) {
        switch(event.code) {
            case 'KeyW':
                moveForward = false;
                break;
            case 'KeyA':
                moveLeft = false;
                break;
            case 'KeyS':
                moveBackward = false;
                break;
            case 'KeyD':
                moveRight = false;
                break;
        }
    });

    // Mouse look controls
    let isMouseDown = false;
    let lastMouseX = 0;
    let lastMouseY = 0;

    document.addEventListener('mousedown', function(event) {
        isMouseDown = true;
        lastMouseX = event.clientX;
        lastMouseY = event.clientY;
    });

    document.addEventListener('mouseup', function() {
        isMouseDown = false;
    });

    document.addEventListener('mousemove', function(event) {
        if (isMouseDown) {
            const deltaX = event.clientX - lastMouseX;
            const deltaY = event.clientY - lastMouseY;
            
            // Rotate camera based on mouse movement
            camera.rotation.y -= deltaX * 0.01;
            camera.rotation.x -= deltaY * 0.01;
            
            // Clamp vertical rotation to avoid flipping
            camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
            
            lastMouseX = event.clientX;
            lastMouseY = event.clientY;
        }
    });
    }

    function toggleDayNight() {
    // Toggle between day and night
    dayTime = !dayTime;

    if (dayTime) {
        // Day settings
        scene.background = new THREE.Color(0x87CEEB); // Sky blue
        scene.fog = new THREE.FogExp2(0xcccccc, 0.002);
        scene.userData.mainLight.intensity = 1;
        scene.userData.mainLight.color.set(0xffffff);
        
        // Update street lamps
        scene.traverse(function(object) {
            if (object.userData && object.userData.pointLight) {
                object.userData.pointLight.intensity = 0.1; // Dimmed during day
            }
        });
        
        document.getElementById('timeDisplay').textContent = 'Day';
        
    } else {
        // Night settings
        scene.background = new THREE.Color(0x000022); // Dark blue night sky
        scene.fog = new THREE.FogExp2(0x000022, 0.001);
        scene.userData.mainLight.intensity = 0.2;
        scene.userData.mainLight.color.set(0x3366ff); // Blueish moonlight
        
        // Update street lamps
        scene.traverse(function(object) {
            if (object.userData && object.userData.pointLight) {
                object.userData.pointLight.intensity = 1; // Brighter at night
            }
        });
        
        document.getElementById('timeDisplay').textContent = 'Night';
    }
    }

    function animate() {
    requestAnimationFrame(animate);

    const delta = clock.getDelta();

    // Update car positions
    updateCars(delta);

    // Update pedestrians
    updatePedestrians(delta);

    // Update traffic lights
    updateTrafficLights(delta);

    // Update camera movement
    updateCamera(delta);

    renderer.render(scene, camera);
    }

    function updateCars(delta) {
    cars.forEach(car => {
        // Calculate movement based on direction and speed
        const dx = Math.sin(car.direction) * car.speed;
        const dz = Math.cos(car.direction) * car.speed;
        
        // Update position
        car.x += dx;
        car.z += dz;
        
        // Update car meshes
        car.body.position.x = car.x;
        car.body.position.z = car.z;
        
        car.cabin.position.x = car.x - 0.5 * Math.sin(car.direction);
        car.cabin.position.z = car.z - 0.5 * Math.cos(car.direction);
        
        // Update wheels
        car.wheels[0].position.x = car.x + 1.3 * Math.sin(car.direction) - Math.cos(car.direction);
        car.wheels[0].position.z = car.z + 1.3 * Math.cos(car.direction) + Math.sin(car.direction);
        
        car.wheels[1].position.x = car.x + 1.3 * Math.sin(car.direction) + Math.cos(car.direction);
        car.wheels[1].position.z = car.z + 1.3 * Math.cos(car.direction) - Math.sin(car.direction);
        
        car.wheels[2].position.x = car.x - 1.3 * Math.sin(car.direction) - Math.cos(car.direction);
        car.wheels[2].position.z = car.z - 1.3 * Math.cos(car.direction) + Math.sin(car.direction);
        
        car.wheels[3].position.x = car.x - 1.3 * Math.sin(car.direction) + Math.cos(car.direction);
        car.wheels[3].position.z = car.z - 1.3 * Math.cos(car.direction) - Math.sin(car.direction);
        
        // Check if car has reached the edge of the city
        const cityBoundary = CITY_SIZE / 2;
        if (
            car.x < -cityBoundary || 
            car.x > cityBoundary || 
            car.z < -cityBoundary || 
            car.z > cityBoundary
        ) {
            // Reset car to opposite side
            if (car.x < -cityBoundary) car.x = cityBoundary;
            if (car.x > cityBoundary) car.x = -cityBoundary;
            if (car.z < -cityBoundary) car.z = cityBoundary;
            if (car.z > cityBoundary) car.z = -cityBoundary;
        }
    });
    }

    function updatePedestrians(delta) {
    const time = clock.getElapsedTime();

    pedestrians.forEach(ped => {
        // Calculate movement based on direction and speed
        const dx = Math.sin(ped.direction) * ped.walkingSpeed;
        const dz = Math.cos(ped.direction) * ped.walkingSpeed;
        
        // Update position
        ped.group.position.x += dx;
        ped.group.position.z += dz;
        
        // Animate arms and legs with a walking motion
        const armAngle = Math.sin(time * 3 + ped.armSwingOffset) * 0.2;
        const legAngle = Math.sin(time * 3 + ped.legSwingOffset) * 0.2;
        
        ped.leftArm.rotation.x = -armAngle;
        ped.rightArm.rotation.x = armAngle;
        ped.leftLeg.rotation.x = legAngle;
        ped.rightLeg.rotation.x = -legAngle;
        
        // Check if pedestrian has reached the edge of the city
        const cityBoundary = CITY_SIZE / 2;
        if (
            ped.group.position.x < -cityBoundary || 
            ped.group.position.x > cityBoundary || 
            ped.group.position.z < -cityBoundary || 
            ped.group.position.z > cityBoundary
        ) {
            // Reset pedestrian to opposite side
            if (ped.group.position.x < -cityBoundary) ped.group.position.x = cityBoundary;
            if (ped.group.position.x > cityBoundary) ped.group.position.x = -cityBoundary;
            if (ped.group.position.z < -cityBoundary) ped.group.position.z = cityBoundary;
            if (ped.group.position.z > cityBoundary) ped.group.position.z = -cityBoundary;
        }
    });
    }

    function updateTrafficLights(delta) {
    trafficLights.forEach(light => {
        // Update timer
        light.timer -= delta;
        
        // Reset all lights to low opacity
        light.red.material.opacity = 0.2;
        light.yellow.material.opacity = 0.2;
        light.green.material.opacity = 0.2;
        
        // Set the active light based on state
        if (light.state === 0) {
            // Red light
            light.red.material.opacity = 1;
            
            if (light.timer <= 0) {
                light.state = 2; // Skip to green
                light.timer = 10 + Math.random() * 5; // Green duration
            }
        } else if (light.state === 1) {
            // Yellow light
            light.yellow.material.opacity = 1;
            
            if (light.timer <= 0) {
                light.state = 0; // Change to red
                light.timer = 10 + Math.random() * 5; // Red duration
            }
        } else {
            // Green light
            light.green.material.opacity = 1;
            
            if (light.timer <= 0) {
                light.state = 1; // Change to yellow
                light.timer = 3; // Yellow duration
            }
        }
    });
    }

    function updateCamera(delta) {
    // Calculate velocity
    velocity.x = 0;
    velocity.z = 0;

    direction.z = Number(moveForward) - Number(moveBackward);
    direction.x = Number(moveRight) - Number(moveLeft);
    direction.normalize();

    if (moveForward || moveBackward) velocity.z -= direction.z * cameraSpeed;
    if (moveLeft || moveRight) velocity.x -= direction.x * cameraSpeed;

    // Update camera position
    camera.position.x += velocity.x * Math.cos(camera.rotation.y) - velocity.z * Math.sin(camera.rotation.y);
    camera.position.z += velocity.x * Math.sin(camera.rotation.y) + velocity.z * Math.cos(camera.rotation.y);

    // Keep camera at a fixed height
    camera.position.y = 10;
    }

// Initialize the scene
init();
