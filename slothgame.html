<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sloth Escape: Cafeteria Chaos</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #gameContainer {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        #gameOverScreen {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            z-index: 100;
        }
        #playAgainBtn {
            background-color: #4CAF50;
            border: none;
            color: white;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
            border-radius: 5px;
        }
        #infoText {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="gameContainer"></div>
    <div id="infoText">
        W/A/S/D: Move<br>
        Right-click drag: Look around<br>
        Escape the growing sloths!
    </div>
    <div id="gameOverScreen">
        <h2>GAME OVER</h2>
        <p>You were caught by a sloth!</p>
        <button id="playAgainBtn">Play Again</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Game variables
        let camera, scene, renderer;
        let player, playerHeight = 1.7;
        let sloths = [];
        let objects = [];
        let floor;
        let keys = {};
        let gameOver = false;
        let clock = new THREE.Clock();
        
        // Movement variables
        let moveForward = false;
        let moveBackward = false;
        let moveLeft = false;
        let moveRight = false;
        let canJump = false;
        let playerVelocity = new THREE.Vector3();
        let direction = new THREE.Vector3();
        let prevTime = performance.now();
        
        // Camera control variables
        let cameraRotation = {
            x: 0,
            y: 0
        };
        let isDragging = false;
        let previousMousePosition = {
            x: 0,
            y: 0
        };
        
        init();
        animate();
        
        function init() {
            // Create scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.Fog(0x87CEEB, 20, 100);
            
            // Create camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.y = playerHeight;
            
            // Create renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('gameContainer').appendChild(renderer.domElement);
            
            // Lighting
            const ambientLight = new THREE.AmbientLight(0x404040);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(1, 10, 5);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 1024;
            directionalLight.shadow.mapSize.height = 1024;
            scene.add(directionalLight);
            
            // Create floor (cafeteria floor)
            const floorGeometry = new THREE.PlaneGeometry(40, 40);
            const floorMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xD3D3D3,
                roughness: 0.8,
                metalness: 0.2
            });
            floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);
            objects.push(floor);
            
            // Create walls
            createWalls();
            
            // Create cafeteria objects (tables, chairs, etc.)
            createCafeteriaObjects();
            
            // Create player
            createPlayer();
            
            // Create sloths
            createSloths();
            
            // Event listeners
            window.addEventListener('resize', onWindowResize);
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            document.addEventListener('mousedown', onMouseDown);
            document.addEventListener('mouseup', onMouseUp);
            document.addEventListener('mousemove', onMouseMove);
            document.getElementById('playAgainBtn').addEventListener('click', resetGame);
        }
        
        function createWalls() {
            const wallMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xF5F5DC,
                roughness: 0.9,
                metalness: 0.1
            });
            
            // Wall height
            const wallHeight = 8;
            
            // North wall
            const northWallGeometry = new THREE.BoxGeometry(40, wallHeight, 0.5);
            const northWall = new THREE.Mesh(northWallGeometry, wallMaterial);
            northWall.position.set(0, wallHeight/2, -20);
            northWall.receiveShadow = true;
            northWall.castShadow = true;
            scene.add(northWall);
            objects.push(northWall);
            
            // South wall
            const southWall = northWall.clone();
            southWall.position.set(0, wallHeight/2, 20);
            scene.add(southWall);
            objects.push(southWall);
            
            // East wall
            const eastWallGeometry = new THREE.BoxGeometry(0.5, wallHeight, 40);
            const eastWall = new THREE.Mesh(eastWallGeometry, wallMaterial);
            eastWall.position.set(20, wallHeight/2, 0);
            eastWall.receiveShadow = true;
            eastWall.castShadow = true;
            scene.add(eastWall);
            objects.push(eastWall);
            
            // West wall
            const westWall = eastWall.clone();
            westWall.position.set(-20, wallHeight/2, 0);
            scene.add(westWall);
            objects.push(westWall);
            
            // Ceiling
            const ceilingGeometry = new THREE.PlaneGeometry(40, 40);
            const ceilingMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xF0F0F0,
                side: THREE.DoubleSide
            });
            const ceiling = new THREE.Mesh(ceilingGeometry, ceilingMaterial);
            ceiling.rotation.x = Math.PI / 2;
            ceiling.position.set(0, wallHeight, 0);
            ceiling.receiveShadow = true;
            scene.add(ceiling);
            
            // Add ceiling lights
            for (let x = -15; x <= 15; x += 10) {
                for (let z = -15; z <= 15; z += 10) {
                    const lightGeometry = new THREE.BoxGeometry(3, 0.2, 3);
                    const lightMaterial = new THREE.MeshStandardMaterial({
                        color: 0xFFFFFF,
                        emissive: 0xFFFFFF,
                        emissiveIntensity: 0.5
                    });
                    const light = new THREE.Mesh(lightGeometry, lightMaterial);
                    light.position.set(x, wallHeight - 0.1, z);
                    scene.add(light);
                    
                    // Add point light at ceiling light
                    const pointLight = new THREE.PointLight(0xFFFFFF, 0.5, 20);
                    pointLight.position.set(x, wallHeight - 0.3, z);
                    scene.add(pointLight);
                }
            }
            
            // Add a door in the north wall
            const doorWidth = 3;
            const doorHeight = 4;
            const doorGeometry = new THREE.BoxGeometry(doorWidth, doorHeight, 0.3);
            const doorMaterial = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
            const door = new THREE.Mesh(doorGeometry, doorMaterial);
            door.position.set(-10, doorHeight/2, -19.8);
            door.receiveShadow = true;
            door.castShadow = true;
            scene.add(door);
            objects.push(door);
        }
        
        function createCafeteriaObjects() {
            // Create tables in a more asymmetric pattern
            const tablePositions = [
                // Left side cluster
                {x: -15, z: -10},
                {x: -13, z: -5},
                {x: -10, z: -12},
                {x: -8, z: -7},
                // Center area (more sparse)
                {x: -2, z: 0},
                {x: 3, z: -3},
                {x: 4, z: 5},
                {x: -5, z: 7},
                // Right side (scattered)
                {x: 10, z: -8},
                {x: 12, z: -2},
                {x: 13, z: 10},
                {x: 8, z: 12},
            ];
            
            for (const pos of tablePositions) {
                createTable(pos.x, pos.z);
            }
            
            // Create serving counter (L-shaped)
            const mainCounterGeometry = new THREE.BoxGeometry(30, 1.2, 3);
            const counterMaterial = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
            const mainCounter = new THREE.Mesh(mainCounterGeometry, counterMaterial);
            mainCounter.position.set(-3, 0.6, -16);
            mainCounter.castShadow = true;
            mainCounter.receiveShadow = true;
            scene.add(mainCounter);
            objects.push(mainCounter);
            
            // Side counter (L shape extension)
            const sideCounterGeometry = new THREE.BoxGeometry(3, 1.2, 10);
            const sideCounter = new THREE.Mesh(sideCounterGeometry, counterMaterial);
            sideCounter.position.set(13, 0.6, -11);
            sideCounter.castShadow = true;
            sideCounter.receiveShadow = true;
            scene.add(sideCounter);
            objects.push(sideCounter);
            
            // Create food display on counter
            const foodTypes = [0xFFD700, 0x228B22, 0xDC143C, 0xFFA500, 0x8B0000, 0xFFFFE0];
            for (let i = -15; i <= 10; i += 5) {
                const foodDisplayGeometry = new THREE.BoxGeometry(3, 0.8, 2);
                const foodDisplayMaterial = new THREE.MeshStandardMaterial({ 
                    color: foodTypes[Math.floor(Math.random() * foodTypes.length)]
                });
                const foodDisplay = new THREE.Mesh(foodDisplayGeometry, foodDisplayMaterial);
                foodDisplay.position.set(i, 1.45, -16);
                foodDisplay.castShadow = true;
                foodDisplay.receiveShadow = true;
                scene.add(foodDisplay);
                objects.push(foodDisplay);
            }
            
            // Add a drink machine
            const machineGeometry = new THREE.BoxGeometry(2, 4, 1.5);
            const machineMaterial = new THREE.MeshStandardMaterial({ color: 0x708090 });
            const drinkMachine = new THREE.Mesh(machineGeometry, machineMaterial);
            drinkMachine.position.set(13, 2, -16);
            drinkMachine.castShadow = true;
            drinkMachine.receiveShadow = true;
            scene.add(drinkMachine);
            objects.push(drinkMachine);
            
            // Add a salad bar in the middle
            const saladBarGeometry = new THREE.BoxGeometry(8, 1.5, 4);
            const saladBarMaterial = new THREE.MeshStandardMaterial({ color: 0x32CD32 });
            const saladBar = new THREE.Mesh(saladBarGeometry, saladBarMaterial);
            saladBar.position.set(-7, 0.75, 0);
            saladBar.castShadow = true;
            saladBar.receiveShadow = true;
            scene.add(saladBar);
            objects.push(saladBar);
            
            // Add a check-out register
            const registerGeometry = new THREE.BoxGeometry(2, 1, 2);
            const registerMaterial = new THREE.MeshStandardMaterial({ color: 0x000000 });
            const register = new THREE.Mesh(registerGeometry, registerMaterial);
            register.position.set(13, 1.2, -5);
            register.castShadow = true;
            register.receiveShadow = true;
            scene.add(register);
            objects.push(register);
            
            // Create random chairs (not attached to tables)
            const chairPositions = [
                {x: -17, z: 5},
                {x: 6, z: -12},
                {x: 16, z: 5},
                {x: -3, z: 13},
                {x: 0, z: -15}
            ];
            
            for (const pos of chairPositions) {
                createChair(pos.x, pos.z);
            }
            
            // Create trash cans
            createTrashCan(-18, 18);
            createTrashCan(18, 18);
            createTrashCan(18, -18);
            createTrashCan(-18, -18);
            createTrashCan(0, 18);
        }
        
        function createTable(x, z) {
            // Table top
            const tableTopGeometry = new THREE.BoxGeometry(5, 0.2, 3);
            const tableTopMaterial = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
            const tableTop = new THREE.Mesh(tableTopGeometry, tableTopMaterial);
            tableTop.position.set(x, 0.9, z);
            tableTop.castShadow = true;
            tableTop.receiveShadow = true;
            scene.add(tableTop);
            objects.push(tableTop);
            
            // Table legs
            const legGeometry = new THREE.BoxGeometry(0.2, 0.9, 0.2);
            const legMaterial = new THREE.MeshStandardMaterial({ color: 0x696969 });
            
            const positions = [
                {x: x - 2.3, z: z - 1.3},
                {x: x - 2.3, z: z + 1.3},
                {x: x + 2.3, z: z - 1.3},
                {x: x + 2.3, z: z + 1.3}
            ];
            
            for (const pos of positions) {
                const leg = new THREE.Mesh(legGeometry, legMaterial);
                leg.position.set(pos.x, 0.45, pos.z);
                leg.castShadow = true;
                leg.receiveShadow = true;
                scene.add(leg);
                objects.push(leg);
            }
            
            // Create benches
            const benchGeometry = new THREE.BoxGeometry(5, 0.1, 0.8);
            const benchMaterial = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
            
            const frontBench = new THREE.Mesh(benchGeometry, benchMaterial);
            frontBench.position.set(x, 0.5, z + 2);
            frontBench.castShadow = true;
            frontBench.receiveShadow = true;
            scene.add(frontBench);
            objects.push(frontBench);
            
            const backBench = frontBench.clone();
            backBench.position.set(x, 0.5, z - 2);
            scene.add(backBench);
            objects.push(backBench);
        }
        
        function createTrashCan(x, z) {
            const trashCanGeometry = new THREE.CylinderGeometry(0.7, 0.5, 1.5, 8);
            const trashCanMaterial = new THREE.MeshStandardMaterial({ color: 0x2E8B57 });
            const trashCan = new THREE.Mesh(trashCanGeometry, trashCanMaterial);
            trashCan.position.set(x, 0.75, z);
            trashCan.castShadow = true;
            trashCan.receiveShadow = true;
            scene.add(trashCan);
            objects.push(trashCan);
        }
        
        function createPlayer() {
            // Player body
            const playerGeometry = new THREE.CylinderGeometry(0.3, 0.3, playerHeight, 32);
            const playerMaterial = new THREE.MeshStandardMaterial({ color: 0x1E90FF });
            player = new THREE.Mesh(playerGeometry, playerMaterial);
            player.position.set(-5, playerHeight / 2, 5);
            player.castShadow = true;
            player.receiveShadow = true;
            scene.add(player);
            
            // Player collision box (slightly smaller than visual model)
            player.collisionRadius = 0.25;
            
            // Set initial camera position to player
            camera.position.copy(player.position);
            camera.position.y = playerHeight;
        }
        
        function createChair(x, z) {
            // Chair seat
            const seatGeometry = new THREE.BoxGeometry(0.8, 0.1, 0.8);
            const chairMaterial = new THREE.MeshStandardMaterial({ color: 0x8B0000 });
            const seat = new THREE.Mesh(seatGeometry, chairMaterial);
            seat.position.set(x, 0.5, z);
            seat.castShadow = true;
            seat.receiveShadow = true;
            scene.add(seat);
            objects.push(seat);
            
            // Chair back
            const backGeometry = new THREE.BoxGeometry(0.8, 1, 0.1);
            const back = new THREE.Mesh(backGeometry, chairMaterial);
            back.position.set(x, 1.05, z + 0.35);
            back.castShadow = true;
            back.receiveShadow = true;
            scene.add(back);
            objects.push(back);
            
            // Chair legs
            const legGeometry = new THREE.CylinderGeometry(0.05, 0.05, 0.5, 8);
            const legMaterial = new THREE.MeshStandardMaterial({ color: 0x696969 });
            
            const positions = [
                {x: x - 0.3, z: z - 0.3},
                {x: x - 0.3, z: z + 0.3},
                {x: x + 0.3, z: z - 0.3},
                {x: x + 0.3, z: z + 0.3}
            ];
            
            for (const pos of positions) {
                const leg = new THREE.Mesh(legGeometry, legMaterial);
                leg.position.set(pos.x, 0.25, pos.z);
                leg.castShadow = true;
                leg.receiveShadow = true;
                scene.add(leg);
                objects.push(leg);
            }
        }
        
        function createSloths() {
            const slothPositions = [
                {x: 15, z: 15},
                {x: -15, z: 15},
                {x: 0, z: -15}
            ];
            
            const slothColors = [
                0x8B4513, // Brown
                0x6B8E23, // Olive
                0x4B3621  // Dark brown
            ];
            
            for (let i = 0; i < 3; i++) {
                const slothSize = 0.5; // Initial size
                // Make sloths taller and lankier
                const slothGeometry = new THREE.BoxGeometry(slothSize * 0.8, slothSize * 2.5, slothSize * 0.7);
                
                // Create sloth body
                const slothMaterial = new THREE.MeshStandardMaterial({ color: slothColors[i] });
                const sloth = new THREE.Mesh(slothGeometry, slothMaterial);
                sloth.position.set(slothPositions[i].x, slothSize * 2.5 / 2, slothPositions[i].z);
                sloth.castShadow = true;
                sloth.receiveShadow = true;
                
                // Add sloth properties
                sloth.size = slothSize;
                sloth.growthRate = 0.005; // Growth rate per second
                sloth.baseSpeed = 0.5; // Base speed
                sloth.speedGrowthFactor = 0.08; // Speed grows much slower than size
                
                scene.add(sloth);
                sloths.push(sloth);
                
                // Add head slightly above body
                const headGeometry = new THREE.SphereGeometry(slothSize * 0.7, 16, 16);
                const headMaterial = new THREE.MeshStandardMaterial({ color: slothColors[i] });
                const head = new THREE.Mesh(headGeometry, headMaterial);
                head.position.set(0, slothSize * 1.4, 0);
                sloth.add(head);
                
                // Add weird eyes to sloth - bigger, more spaced out and asymmetric
                const eyeGeometry = new THREE.SphereGeometry(slothSize * 0.2, 16, 16);
                const eyeMaterial = new THREE.MeshStandardMaterial({ color: 0xFFFFFF });
                
                const leftEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
                leftEye.position.set(slothSize * 0.4, slothSize * 1.4, -slothSize * 0.5);
                sloth.add(leftEye);
                
                const rightEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
                rightEye.scale.set(0.8, 1.2, 1);
                rightEye.position.set(-slothSize * 0.5, slothSize * 1.5, -slothSize * 0.4);
                sloth.add(rightEye);
                
                // Add pupils
                const pupilGeometry = new THREE.SphereGeometry(slothSize * 0.1, 16, 16);
                const pupilMaterial = new THREE.MeshStandardMaterial({ color: 0x000000 });
                
                const leftPupil = new THREE.Mesh(pupilGeometry, pupilMaterial);
                leftPupil.position.set(0, 0, slothSize * 0.15);
                leftEye.add(leftPupil);
                
                const rightPupil = new THREE.Mesh(pupilGeometry, pupilMaterial);
                rightPupil.position.set(0, 0, slothSize * 0.15);
                rightEye.add(rightPupil);
                
                // Add weird nose to sloth
                const noseGeometry = new THREE.ConeGeometry(slothSize * 0.2, slothSize * 0.4, 5);
                const noseMaterial = new THREE.MeshStandardMaterial({ color: 0x000000 });
                const nose = new THREE.Mesh(noseGeometry, noseMaterial);
                nose.rotation.x = Math.PI / 2;
                nose.position.set(0, slothSize * 1.3, -slothSize * 0.7);
                sloth.add(nose);
                
                // Add super long lankier arms to sloth
                const armGeometry = new THREE.CylinderGeometry(slothSize * 0.12, slothSize * 0.08, slothSize * 2.2, 8);
                const armMaterial = new THREE.MeshStandardMaterial({ color: slothColors[i] });
                
                const leftArm = new THREE.Mesh(armGeometry, armMaterial);
                leftArm.rotation.z = Math.PI / 3;
                leftArm.position.set(slothSize * 0.6, slothSize * 0.6, 0);
                sloth.add(leftArm);
                
                const rightArm = new THREE.Mesh(armGeometry, armMaterial);
                rightArm.rotation.z = -Math.PI / 3;
                rightArm.position.set(-slothSize * 0.6, slothSize * 0.6, 0);
                sloth.add(rightArm);
                
                // Add claws to arms
                const clawGeometry = new THREE.ConeGeometry(slothSize * 0.1, slothSize * 0.4, 3);
                const clawMaterial = new THREE.MeshStandardMaterial({ color: 0xFFFFFF });
                
                // Left arm claws
                const leftClaw1 = new THREE.Mesh(clawGeometry, clawMaterial);
                leftClaw1.rotation.x = -Math.PI / 2;
                leftClaw1.position.set(0, -slothSize * 1.0, 0);
                leftArm.add(leftClaw1);
                
                const leftClaw2 = leftClaw1.clone();
                leftClaw2.position.set(slothSize * 0.15, -slothSize * 1.0, 0);
                leftArm.add(leftClaw2);
                
                const leftClaw3 = leftClaw1.clone();
                leftClaw3.position.set(-slothSize * 0.15, -slothSize * 1.0, 0);
                leftArm.add(leftClaw3);
                
                // Right arm claws
                const rightClaw1 = leftClaw1.clone();
                rightClaw1.position.set(0, -slothSize * 1.0, 0);
                rightArm.add(rightClaw1);
                
                const rightClaw2 = leftClaw1.clone();
                rightClaw2.position.set(slothSize * 0.15, -slothSize * 1.0, 0);
                rightArm.add(rightClaw2);
                
                const rightClaw3 = leftClaw1.clone();
                rightClaw3.position.set(-slothSize * 0.15, -slothSize * 1.0, 0);
                rightArm.add(rightClaw3);
                
                // Add legs
                const legGeometry = new THREE.CylinderGeometry(slothSize * 0.15, slothSize * 0.1, slothSize * 1.2, 8);
                const legMaterial = new THREE.MeshStandardMaterial({ color: slothColors[i] });
                
                const leftLeg = new THREE.Mesh(legGeometry, legMaterial);
                leftLeg.position.set(slothSize * 0.3, -slothSize * 1.2, 0);
                sloth.add(leftLeg);
                
                const rightLeg = new THREE.Mesh(legGeometry, legMaterial);
                rightLeg.position.set(-slothSize * 0.3, -slothSize * 1.2, 0);
                sloth.add(rightLeg);
            }
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        function onKeyDown(event) {
            keys[event.code] = true;
            
            switch (event.code) {
                case 'KeyW':
                    moveForward = true;
                    break;
                case 'KeyA':
                    moveLeft = true;
                    break;
                case 'KeyS':
                    moveBackward = true;
                    break;
                case 'KeyD':
                    moveRight = true;
                    break;
            }
        }
        
        function onKeyUp(event) {
            keys[event.code] = false;
            
            switch (event.code) {
                case 'KeyW':
                    moveForward = false;
                    break;
                case 'KeyA':
                    moveLeft = false;
                    break;
                case 'KeyS':
                    moveBackward = false;
                    break;
                case 'KeyD':
                    moveRight = false;
                    break;
            }
        }
        
        function onMouseDown(event) {
            if (event.button === 2) { // Right mouse button
                event.preventDefault();
                isDragging = true;
                previousMousePosition = {
                    x: event.clientX,
                    y: event.clientY
                };
            }
        }
        
        function onMouseUp(event) {
            if (event.button === 2) { // Right mouse button
                isDragging = false;
            }
        }
        
        function onMouseMove(event) {
            if (isDragging) {
                const deltaMove = {
                    x: event.clientX - previousMousePosition.x,
                    y: event.clientY - previousMousePosition.y
                };
                
                // Apply rotation
                cameraRotation.y -= deltaMove.x * 0.003;
                cameraRotation.x -= deltaMove.y * 0.003;
                
                // Limit vertical rotation
                cameraRotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, cameraRotation.x));
                
                previousMousePosition = {
                    x: event.clientX,
                    y: event.clientY
                };
            }
        }
        
        function updatePlayerPosition(delta) {
            if (gameOver) return;
            
            const speed = 5.0;
            
            // Calculate movement direction
            direction.z = Number(moveForward) - Number(moveBackward);
            direction.x = Number(moveRight) - Number(moveLeft);
            direction.normalize();
            
            // Apply camera rotation to movement direction
            const rotatedDirection = new THREE.Vector3();
            rotatedDirection.x = direction.x * Math.cos(cameraRotation.y) + direction.z * Math.sin(cameraRotation.y);
            rotatedDirection.z = -direction.x * Math.sin(cameraRotation.y) + direction.z * Math.cos(cameraRotation.y);
            
            // Update velocity
            if (moveForward || moveBackward) playerVelocity.z = -rotatedDirection.z * speed * delta;
            else playerVelocity.z = 0;
            
            if (moveLeft || moveRight) playerVelocity.x = -rotatedDirection.x * speed * delta;
            else playerVelocity.x = 0;
            
            // Update player position
            player.position.x += playerVelocity.x;
            player.position.z += playerVelocity.z;
            
            // Keep player within bounds
            const boundaryLimit = 19.5;
            player.position.x = Math.max(-boundaryLimit, Math.min(boundaryLimit, player.position.x));
            player.position.z = Math.max(-boundaryLimit, Math.min(boundaryLimit, player.position.z));
            
            // Collision detection with objects
            for (const object of objects) {
                if (object instanceof THREE.Mesh && object !== floor) {
                    // Simple box collision detection
                    if (object.geometry.type === 'BoxGeometry') {
                        const objectBox = new THREE.Box3().setFromObject(object);
                        const playerRadius = player.collisionRadius;
                        
                        // Check for collision on X axis
                        if (player.position.x + playerRadius > objectBox.min.x && 
                            player.position.x - playerRadius < objectBox.max.x &&
                            player.position.z + playerRadius > objectBox.min.z &&
                            player.position.z - playerRadius < objectBox.max.z) {
                            
                            // Find closest face to push away from
                            const distToMinX = Math.abs(player.position.x - objectBox.min.x);
                            const distToMaxX = Math.abs(player.position.x - objectBox.max.x);
                            const distToMinZ = Math.abs(player.position.z - objectBox.min.z);
                            const distToMaxZ = Math.abs(player.position.z - objectBox.max.z);
                            
                            const minDist = Math.min(distToMinX, distToMaxX, distToMinZ, distToMaxZ);
                            
                            if (minDist === distToMinX) {
                                player.position.x = objectBox.min.x - playerRadius;
                            } else if (minDist === distToMaxX) {
                                player.position.x = objectBox.max.x + playerRadius;
                            } else if (minDist === distToMinZ) {
                                player.position.z = objectBox.min.z - playerRadius;
                            } else if (minDist === distToMaxZ) {
                                player.position.z = objectBox.max.z + playerRadius;
                            }
                        }
                    }
                    // Cylinder collision detection for trash cans
                    else if (object.geometry.type === 'CylinderGeometry') {
                        const dx = player.position.x - object.position.x;
                        const dz = player.position.z - object.position.z;
                        const distance = Math.sqrt(dx * dx + dz * dz);
                        const minDistance = player.collisionRadius + 0.7; // 0.7 is the trash can radius
                        
                        if (distance < minDistance) {
                            const angle = Math.atan2(dz, dx);
                            player.position.x = object.position.x + Math.cos(angle) * minDistance;
                            player.position.z = object.position.z + Math.sin(angle) * minDistance;
                        }
                    }
                }
            }
            
            // Update camera position
            camera.position.copy(player.position);
            camera.position.y = playerHeight;
            
            // Update camera rotation
            camera.rotation.order = 'YXZ';
            camera.rotation.y = cameraRotation.y;
            camera.rotation.x = cameraRotation.x;
        }
        
        function updateSloths(delta) {
            if (gameOver) return;
            
            for (const sloth of sloths) {
                // Grow sloth
                sloth.size += sloth.growthRate * delta;
                
                // Update sloth geometry
                sloth.scale.set(
                    sloth.size / 0.5,
                    sloth.size / 0.5,
                    sloth.size / 0.5
                );
                
                // Update sloth position (height adjustment for growing)
                sloth.position.y = sloth.size * 2.5 / 2;
                
                // Calculate direction to player
                const directionToPlayer = new THREE.Vector3();
                directionToPlayer.subVectors(player.position, sloth.position);
                directionToPlayer.y = 0; // Keep on ground plane
                directionToPlayer.normalize();
                
                // Calculate speed (increases slowly with size)
                const speed = sloth.baseSpeed + (sloth.size - 0.5) * sloth.speedGrowthFactor;
                
                // Move sloth towards player
                sloth.position.x += directionToPlayer.x * speed * delta;
                sloth.position.z += directionToPlayer.z * speed * delta;
                
                // Rotate sloth to face player
                const angle = Math.atan2(directionToPlayer.x, directionToPlayer.z);
                sloth.rotation.y = angle;
                
                // Check for collision with player
                const dx = player.position.x - sloth.position.x;
                const dz = player.position.z - sloth.position.z;
                const distance = Math.sqrt(dx * dx + dz * dz);
                
                if (distance < player.collisionRadius + sloth.size * 0.5) {
                    gameOver = true;
                    document.getElementById('gameOverScreen').style.display = 'block';
                }
            }
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            const delta = clock.getDelta();
            
            if (!gameOver) {
                updatePlayerPosition(delta);
                updateSloths(delta);
            }
            
            renderer.render(scene, camera);
        }
        
        function resetGame() {
            // Reset game state
            gameOver = false;
            document.getElementById('gameOverScreen').style.display = 'none';
            
            // Reset player position
            player.position.set(-5, playerHeight / 2, 5);
            
            // Reset camera position and rotation
            camera.position.copy(player.position);
            camera.position.y = playerHeight;
            cameraRotation.x = 0;
            cameraRotation.y = 0;
            
            // Reset sloths
            for (const sloth of sloths) {
                scene.remove(sloth);
            }
            sloths = [];
            createSloths();
        }
        
        // Prevent context menu on right-click
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });
    </script>
</body>
