<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inside a Beehive - Three.js Simulation</title>
    <!-- Using the newer module version as recommended -->
    <script async src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.159.0/three.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        canvas {
            display: block;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            max-width: 300px;
            z-index: 100;
        }
        #legend {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            max-width: 300px;
            z-index: 100;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin: 5px 0;
        }
        .color-box {
            width: 15px;
            height: 15px;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div id="info">
        <h2>Inside a Beehive</h2>
        <p>Use mouse to rotate and explore. Scroll to zoom.</p>
        <p>Space to toggle animation</p>
    </div>
    <div id="legend">
        <h3>Bee Types & Activities</h3>
        <div class="legend-item">
            <div class="color-box" style="background-color: #ffcc00;"></div>
            <span>Queen Bee</span>
        </div>
        <div class="legend-item">
            <div class="color-box" style="background-color: #333333;"></div>
            <span>Worker Bees</span>
        </div>
        <div class="legend-item">
            <div class="color-box" style="background-color: #9966cc;"></div>
            <span>Drone Bees</span>
        </div>
        <div class="legend-item">
            <div class="color-box" style="background-color: #ff8855;"></div>
            <span>Nurse Bees</span>
        </div>
        <div class="legend-item">
            <div class="color-box" style="background-color: #669900;"></div>
            <span>Pollen</span>
        </div>
    </div>

    <script>
        // Wait for DOM content to be loaded and Three.js to be available
        document.addEventListener('DOMContentLoaded', function() {
            // Check if THREE is loaded after a short delay
            setTimeout(function() {
                if (typeof THREE === 'undefined') {
                    console.error('THREE is not defined. Make sure the Three.js library is loaded correctly.');
                    document.getElementById('info').innerHTML = '<h2>Error Loading Three.js</h2><p>Please check console for details.</p>';
                    return;
                }
                
                initBeehive();
            }, 500); // Wait 500ms to ensure THREE is loaded
        });

        function initBeehive() {
            // Main simulation parameters
            const params = {
                beeCount: { workers: 50, drones: 10, nurses: 15 },
                hiveSize: { width: 7, height: 5, depth: 5 },
                honeycombs: 60,
                animated: true
            };

            // Set up the scene
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0xddb06b);
            
            // Set up the camera
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 10;
            
            // Set up the renderer
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);
            
            // Set up lights
            const ambientLight = new THREE.AmbientLight(0xcc9955, 0.4);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 5, 5);
            directionalLight.castShadow = true;
            scene.add(directionalLight);
            
            const pointLight = new THREE.PointLight(0xffbb77, 1, 15);
            pointLight.position.set(0, 0, 0);
            scene.add(pointLight);

            // Create beehive outer shell (oval shape)
            function createHiveShell() {
                // Create an ellipsoid using a sphere that we'll scale
                const geometry = new THREE.SphereGeometry(
                    params.hiveSize.width,
                    32, 
                    32
                );
                
                const material = new THREE.MeshPhongMaterial({
                    color: 0xb38d51,
                    side: THREE.BackSide,
                    transparent: true,
                    opacity: 0.7,
                    wireframe: false
                });
                
                const hiveShell = new THREE.Mesh(geometry, material);
                // Scale to make it oval-shaped
                hiveShell.scale.set(1, params.hiveSize.height / params.hiveSize.width, 1);
                scene.add(hiveShell);
                
                return hiveShell;
            }

            // Create honeycomb cells
            function createHoneycombs() {
                const honeycombs = new THREE.Group();
                const hexGeometry = new THREE.CylinderGeometry(0.2, 0.2, 0.4, 6);
                
                // Create different materials for cell types
                const emptyMaterial = new THREE.MeshPhongMaterial({ color: 0xddaa66 });
                const honeyMaterial = new THREE.MeshPhongMaterial({ 
                    color: 0xffcc00, 
                    transparent: true, 
                    opacity: 0.8 
                });
                const pollenMaterial = new THREE.MeshPhongMaterial({ color: 0x669900 });
                const broodMaterial = new THREE.MeshPhongMaterial({ color: 0xffffcc });
                
                // Calculate arrangement of cells
                const radiusX = params.hiveSize.width * 0.85;
                const radiusZ = params.hiveSize.depth * 0.85;
                const radiusY = params.hiveSize.height * 0.85;
                
                for (let i = 0; i < params.honeycombs; i++) {
                    // Distribute cells along the inner wall of the ellipsoid
                    const phi = Math.random() * Math.PI * 2;
                    const theta = Math.random() * Math.PI;
                    
                    const x = Math.sin(theta) * Math.cos(phi) * radiusX;
                    const y = Math.cos(theta) * radiusY;
                    const z = Math.sin(theta) * Math.sin(phi) * radiusZ;
                    
                    // Choose material based on location and random factors
                    let material;
                    if (y > radiusY * 0.5) {
                        // Upper part: more honey
                        material = Math.random() > 0.3 ? honeyMaterial : emptyMaterial;
                    } else if (y < -radiusY * 0.3) {
                        // Lower part: more brood
                        material = Math.random() > 0.4 ? broodMaterial : emptyMaterial;
                    } else {
                        // Middle: mix of all types
                        const rand = Math.random();
                        if (rand < 0.3) material = honeyMaterial;
                        else if (rand < 0.5) material = pollenMaterial;
                        else if (rand < 0.8) material = broodMaterial;
                        else material = emptyMaterial;
                    }
                    
                    const cell = new THREE.Mesh(hexGeometry, material);
                    cell.position.set(x, y, z);
                    
                    // Orient the cell to point outward from the center
                    cell.lookAt(0, 0, 0);
                    cell.rotateX(Math.PI / 2);
                    
                    honeycombs.add(cell);
                }
                
                scene.add(honeycombs);
                return honeycombs;
            }

            // Create bee class
            class Bee {
                constructor(type) {
                    this.type = type;
                    this.mesh = this.createBeeMesh();
                    this.speed = 0.01 + Math.random() * 0.02;
                    this.targetPosition = new THREE.Vector3();
                    this.setRandomTarget();
                    this.waitTime = 0;
                    this.state = 'moving'; // 'moving' or 'working'
                    
                    scene.add(this.mesh);
                }
                
                createBeeMesh() {
                    // Body
                    const bodyGeometry = new THREE.SphereGeometry(0.1, 16, 16);
                    let bodyMaterial;
                    
                    // Different colors for different bee types
                    switch(this.type) {
                        case 'queen':
                            bodyMaterial = new THREE.MeshPhongMaterial({ color: 0xffcc00 });
                            break;
                        case 'worker':
                            bodyMaterial = new THREE.MeshPhongMaterial({ color: 0x333333 });
                            break;
                        case 'drone':
                            bodyMaterial = new THREE.MeshPhongMaterial({ color: 0x9966cc });
                            break;
                        case 'nurse':
                            bodyMaterial = new THREE.MeshPhongMaterial({ color: 0xff8855 });
                            break;
                        default:
                            bodyMaterial = new THREE.MeshPhongMaterial({ color: 0x333333 });
                    }
                    
                    const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
                    
                    // Add stripes
                    const stripeGeometry = new THREE.CylinderGeometry(0.102, 0.102, 0.03, 16);
                    const stripeMaterial = new THREE.MeshPhongMaterial({ color: 0xffdd00 });
                    
                    const stripe1 = new THREE.Mesh(stripeGeometry, stripeMaterial);
                    stripe1.position.set(0, 0.03, 0);
                    stripe1.rotation.x = Math.PI / 2;
                    
                    const stripe2 = new THREE.Mesh(stripeGeometry, stripeMaterial);
                    stripe2.position.set(0, -0.03, 0);
                    stripe2.rotation.x = Math.PI / 2;
                    
                    // Wings
                    const wingGeometry = new THREE.PlaneGeometry(0.15, 0.1);
                    const wingMaterial = new THREE.MeshPhongMaterial({
                        color: 0xffffff,
                        transparent: true,
                        opacity: 0.5,
                        side: THREE.DoubleSide
                    });
                    
                    const leftWing = new THREE.Mesh(wingGeometry, wingMaterial);
                    leftWing.position.set(-0.08, 0.07, 0);
                    leftWing.rotation.z = Math.PI / 4;
                    
                    const rightWing = new THREE.Mesh(wingGeometry, wingMaterial);
                    rightWing.position.set(0.08, 0.07, 0);
                    rightWing.rotation.z = -Math.PI / 4;
                    
                    // Group all parts
                    const bee = new THREE.Group();
                    bee.add(body);
                    bee.add(stripe1);
                    bee.add(stripe2);
                    bee.add(leftWing);
                    bee.add(rightWing);
                    
                    // Make queen bee larger
                    if (this.type === 'queen') {
                        bee.scale.set(1.8, 1.8, 1.8);
                    }
                    
                    // Position the bee randomly inside the hive
                    const angle = Math.random() * Math.PI * 2;
                    const radius = Math.random() * params.hiveSize.width * 0.7;
                    const height = (Math.random() - 0.5) * params.hiveSize.height * 1.5;
                    
                    bee.position.set(
                        Math.cos(angle) * radius,
                        height,
                        Math.sin(angle) * radius
                    );
                    
                    // Add properties for animation
                    bee.userData = {
                        wingDirection: 1,
                        wingSpeed: 0.3 + Math.random() * 0.2
                    };
                    
                    return bee;
                }
                
                setRandomTarget() {
                    // Create a random position inside the ellipsoid
                    const phi = Math.random() * Math.PI * 2;
                    const theta = Math.random() * Math.PI;
                    
                    const radiusX = params.hiveSize.width * 0.7;
                    const radiusZ = params.hiveSize.depth * 0.7;
                    const radiusY = params.hiveSize.height * 0.7;
                    
                    const x = Math.sin(theta) * Math.cos(phi) * Math.random() * radiusX;
                    const y = Math.cos(theta) * Math.random() * radiusY;
                    const z = Math.sin(theta) * Math.sin(phi) * Math.random() * radiusZ;
                    
                    this.targetPosition.set(x, y, z);
                    
                    // Queen bee stays more in the center
                    if (this.type === 'queen') {
                        this.targetPosition.multiplyScalar(0.5);
                        this.targetPosition.y *= 0.8;
                    }
                    
                    // Set waiting time based on bee type
                    if (this.type === 'worker') {
                        this.waitTime = Math.random() * 100 + 50;
                    } else if (this.type === 'nurse') {
                        this.waitTime = Math.random() * 200 + 100;
                    } else if (this.type === 'drone') {
                        this.waitTime = Math.random() * 150 + 30;
                    } else {
                        this.waitTime = Math.random() * 300 + 200;
                    }
                }
                
                update() {
                    if (!params.animated) return;
                    
                    // Animate wings
                    const leftWing = this.mesh.children[3];
                    const rightWing = this.mesh.children[4];
                    
                    leftWing.rotation.y += this.mesh.userData.wingSpeed * this.mesh.userData.wingDirection;
                    rightWing.rotation.y -= this.mesh.userData.wingSpeed * this.mesh.userData.wingDirection;
                    
                    if (leftWing.rotation.y > 0.5 || leftWing.rotation.y < -0.2) {
                        this.mesh.userData.wingDirection *= -1;
                    }
                    
                    // State machine
                    if (this.state === 'moving') {
                        // Move towards target
                        const direction = new THREE.Vector3().subVectors(this.targetPosition, this.mesh.position);
                        
                        if (direction.length() < 0.1) {
                            this.state = 'working';
                            this.workCounter = this.waitTime;
                        } else {
                            direction.normalize();
                            this.mesh.position.add(direction.multiplyScalar(this.speed));
                            
                            // Make bee face direction of travel
                            this.mesh.lookAt(this.targetPosition);
                        }
                    } else if (this.state === 'working') {
                        // Stay in place and work
                        this.workCounter--;
                        
                        if (this.workCounter <= 0) {
                            this.state = 'moving';
                            this.setRandomTarget();
                        }
                    }
                }
            }

            // Create bees
            function createBees() {
                const bees = [];
                
                // Create queen bee (only one)
                bees.push(new Bee('queen'));
                
                // Create worker bees
                for (let i = 0; i < params.beeCount.workers; i++) {
                    bees.push(new Bee('worker'));
                }
                
                // Create drone bees
                for (let i = 0; i < params.beeCount.drones; i++) {
                    bees.push(new Bee('drone'));
                }
                
                // Create nurse bees
                for (let i = 0; i < params.beeCount.nurses; i++) {
                    bees.push(new Bee('nurse'));
                }
                
                return bees;
            }
            
            // Create pollen particles
            function createPollen() {
                const particles = new THREE.Group();
                const particleGeometry = new THREE.SphereGeometry(0.03, 8, 8);
                const particleMaterial = new THREE.MeshPhongMaterial({ color: 0x669900 });
                
                for (let i = 0; i < 30; i++) {
                    const particle = new THREE.Mesh(particleGeometry, particleMaterial);
                    
                    // Distribute particles
                    const phi = Math.random() * Math.PI * 2;
                    const theta = Math.random() * Math.PI;
                    
                    const radiusX = params.hiveSize.width * 0.6;
                    const radiusZ = params.hiveSize.depth * 0.6;
                    const radiusY = params.hiveSize.height * 0.6;
                    
                    const x = Math.sin(theta) * Math.cos(phi) * radiusX * Math.random();
                    const y = Math.cos(theta) * radiusY * Math.random();
                    const z = Math.sin(theta) * Math.sin(phi) * radiusZ * Math.random();
                    
                    particle.position.set(x, y, z);
                    
                    // Add animation properties
                    particle.userData = {
                        speed: 0.001 + Math.random() * 0.003,
                        direction: new THREE.Vector3(
                            (Math.random() - 0.5) * 0.01,
                            (Math.random() - 0.5) * 0.01,
                            (Math.random() - 0.5) * 0.01
                        )
                    };
                    
                    particles.add(particle);
                }
                
                scene.add(particles);
                return particles;
            }
            
            // Initialize the hive components
            const hiveShell = createHiveShell();
            const honeycombs = createHoneycombs();
            const bees = createBees();
            const pollen = createPollen();

            // Controls
            let isDragging = false;
            let previousMousePosition = { x: 0, y: 0 };
            
            document.addEventListener('mousedown', (e) => {
                isDragging = true;
            });
            
            document.addEventListener('mouseup', () => {
                isDragging = false;
            });
            
            document.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    const deltaX = e.clientX - previousMousePosition.x;
                    const deltaY = e.clientY - previousMousePosition.y;
                    
                    // Rotate the camera around the hive
                    camera.position.x = camera.position.x * Math.cos(deltaX * 0.01) - camera.position.z * Math.sin(deltaX * 0.01);
                    camera.position.z = camera.position.x * Math.sin(deltaX * 0.01) + camera.position.z * Math.cos(deltaX * 0.01);
                    
                    camera.position.y += deltaY * 0.05;
                    
                    // Clamp vertical position
                    camera.position.y = Math.max(-8, Math.min(8, camera.position.y));
                    
                    camera.lookAt(0, 0, 0);
                }
                
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });
            
            // Mouse wheel for zoom
            document.addEventListener('wheel', (e) => {
                const direction = e.deltaY > 0 ? 1 : -1;
                const cameraVector = new THREE.Vector3(
                    camera.position.x,
                    camera.position.y,
                    camera.position.z
                );
                
                // Normalize and scale
                cameraVector.normalize();
                cameraVector.multiplyScalar(direction * 0.5);
                
                // Apply to camera position
                camera.position.add(cameraVector);
                
                // Limit how close/far the camera can get
                const distance = camera.position.length();
                if (distance < 3) {
                    camera.position.setLength(3);
                } else if (distance > 15) {
                    camera.position.setLength(15);
                }
                
                camera.lookAt(0, 0, 0);
            });
            
            // Toggle animation
            document.addEventListener('keydown', (e) => {
                if (e.code === 'Space') {
                    params.animated = !params.animated;
                }
            });
            
            // Handle window resize
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
            
            // Animation loop
            function animate() {
                requestAnimationFrame(animate);
                
                // Update bee positions and animations
                bees.forEach(bee => bee.update());
                
                // Animate pollen particles
                if (params.animated) {
                    pollen.children.forEach(particle => {
                        particle.position.add(particle.userData.direction);
                        
                        // Bounce back when hitting boundaries
                        const distance = particle.position.length();
                        if (distance > params.hiveSize.width * 0.7) {
                            particle.userData.direction.negate();
                        }
                    });
                }
                
                // Make the camera always look at the center
                camera.lookAt(0, 0, 0);
                
                renderer.render(scene, camera);
            }
            
            animate();
        }
    </script>
</body>
</html>
